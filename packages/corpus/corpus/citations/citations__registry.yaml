# ============================================================================
# Registro delle citazioni — attestazione KB dei citation ID (corpus 0.12.0)
# ============================================================================
# Ogni voce collega un citation ID al nodo KB che lo attesta, con riga e modo
# dell'attestazione. Da corpus 0.6.0 il registro copre tutti gli ID usati nel
# corpus e nelle fixture: un ID usato e non registrato e' un errore
# (E_CITATION_UNREGISTERED), una voce non usata un avviso (W_CITATION_UNUSED).
#
# Convenzione degli ID: <atto>_<numero>_<anno>, poi _art_<n>, _c_<n> (comma),
# _lett_<x> (lettera, minuscola); allegati con il numero romano maiuscolo
# (_allegato_III); direttiva NIS2 con prefisso dir_nis2_; FAQ ACN con il codice
# (faq_a1_1_a_1); faq_settori_sottosettori = pagina FAQ nel suo insieme.
#
# Nodi KB: LLM_Wiki (nis2-knowledge-it), HEAD f373942 (dopo DEC-009, lint del
# 2026-10-30), stesse righe nell'export del Project Knowledge. Righe verificate con grep
# sui nodi; fedelta' riscontrata sui PDF in raw/ (verifiche del 2026-10-28 e del
# 2026-10-30, docs/verifications/2026-10-28-registro-citazioni.md e
# 2026-10-30-lint-kb.md). "Fonte non in raw/" = atto citato dalla KB ma non presente
# tra le fonti del vault. Corpus 0.7.0: righe riallineate a f373942 (il lint ha spostato
# i nodi D.Lgs. 138/2024, Det. 127437/2026, FAQ Ambito e Clausola di salvaguardia).
# Nodo D.Lgs. 138/2024: riscontro su Normattiva del 2026-10-27 e del 2026-10-28
# (DEC-007 parte A, provenance_note riga 8). Le righe delle voci 0.5.0 sono state
# riallineate in 0.6.0 (il commit KB 55d69b7 ha spostato il nodo di 5 righe).
# ============================================================================


# ============================================================================
# Regime: PSNC (Perimetro di Sicurezza Nazionale Cibernetica) — ROUTING ONLY
# ============================================================================
# STATUS: routing-only fino alla release v0.1.0 del tool; risoluzione nel merito in v0.2.
# Questo file NON contiene ancora logica di categorizzazione.
# Quando una domanda di disambiguazione instrada qui (psnc == yes), il decision
# engine applica l'override dichiarato nel settore (category_override: servizi
# PSNC categorizzati "alto" d'ufficio) e rinvia alla voce del catalogo eccezioni.
# La modellazione completa del regime e' rinviata a v0.2.
#
# Voce del catalogo eccezioni corrispondente (classe: GESTITO / category_override):
#   "PSNC — inserimento formale nel Perimetro di Sicurezza Nazionale Cibernetica".
# Cfr. KB: [[concepts/Soggetti PSNC-NIS]] (art. 1 c. 2-bis D.L. 105/2019).

meta:
  regime_id: psnc
  status: routing_only_v0_1
  routing_effect: category_override
  # ADR 0009: in v0.1 l'instradamento al regime e' un'escalation. L'engine copia
  # assessment_mode e verdict_outcome nel Verdict attraverso il reference
  # dell'override (nessuna inferenza); routing_effect alimenta Verdict.regimeRouting.
  assessment_mode: escalate_to_advisor
  verdict_outcome: ambiguous   # invariante: escalate_to_advisor -> sempre ambiguous
  exceptions_catalog_entry: psnc_category_override
  referenced_by:
    - "wizard/wizard__disambiguation.yaml#questions.psnc"
    - "sectors/sectors__cloud_computing.yaml#overrides"
    - "sectors/sectors__energia_elettrica.yaml#overrides"
    - "sectors/sectors__pubblica_amministrazione.yaml#overrides"   # ADR 0014
  citations: [det_acn_155238_2026_art_5, dl_105_2019_art_1_c_2_bis, dlgs_138_2024_art_33]
  open_points:
    - "D.L. 105/2019 non tra le fonti primarie della KB (nessun nodo sorgente, testo non in raw/): procedura di inserimento nel perimetro e organi competenti non attestati; ingest a v0.2 (review avversaria del 2026-11-02, F10). Nessun credito stop-and-ingest usato."

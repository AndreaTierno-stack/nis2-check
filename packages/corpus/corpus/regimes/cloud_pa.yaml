# ============================================================================
# Regime: Cloud PA — ROUTING ONLY
# ============================================================================
# STATUS: routing-only fino alla release v0.1.0 del tool; risoluzione nel merito in v0.2.
# Questo file NON contiene ancora logica di categorizzazione.
# Quando una domanda di disambiguazione instrada qui (cloud_pa == yes), il
# decision engine applica l'override dichiarato nel settore (model_substitution:
# modello Cloud PA ordinari/critici/strategici in luogo del modello NIS) e rinvia
# alla voce del catalogo eccezioni. Modellazione completa rinviata a v0.2.
#
# Voce del catalogo eccezioni corrispondente (classe: GESTITO / model_substitution):
#   "Cloud PA — servizi cloud classificati per la PA (Regolamento Cloud)".
#
# ADR 0014 (corpus 0.6.0): instradato solo dal percorso PA (domanda
# classificazione_cloud_pa). L'art. 4 Det. 155238/2026 riguarda i soggetti NIS che
# "hanno svolto la classificazione dei dati e dei servizi" ex art. 3 DD 21007/24,
# cioe' le PA (FAQ CAT.8); il fornitore cloud qualificato rientra come fornitore
# cloud (FAQ A1.8.2) e non e' instradato qui.
#
# NOTA: se anche psnc == yes, l'intersezione con il category_override PSNC non e'
# risolta dalle fonti -> l'engine emette escalate_to_advisor (verdict_outcome:
# ambiguous), vedi wizard/wizard__pubblica_amministrazione.yaml#multi_regime_intersection.

meta:
  regime_id: cloud_pa
  status: routing_only_v0_1
  routing_effect: model_substitution
  # ADR 0009: in v0.1 l'instradamento al regime e' un'escalation. L'engine copia
  # assessment_mode e verdict_outcome nel Verdict attraverso il reference
  # dell'override (nessuna inferenza); routing_effect alimenta Verdict.regimeRouting.
  assessment_mode: escalate_to_advisor
  verdict_outcome: ambiguous   # invariante: escalate_to_advisor -> sempre ambiguous
  exceptions_catalog_entry: cloud_pa_model_substitution
  referenced_by:
    - "sectors/sectors__pubblica_amministrazione.yaml#overrides"
    - "wizard/wizard__pubblica_amministrazione.yaml#classificazione_cloud_pa"
  citations: [dd_acn_21007_24_art_3, det_acn_155238_2026_art_4]

# ============================================================================
# Catalogo eccezioni — fonte unica dei limiti dichiarati dello strumento (ADR 0012)
# ============================================================================
# Ogni avviso del verdetto (campo `notices` delle regole) e ogni
# Verdict.regimeRouting[].exceptionsCatalogEntry punta a un id di questo file;
# corpus:validate verifica che ogni riferimento risolva.
#
# status:
#   gestito      — lo strumento lo tratta (oggi: instradamento a regime come escalation)
#   segnalato    — lo strumento non lo valuta, ma lo mostra nel verdetto
#   non_gestito  — fuori dal perimetro dello strumento, dichiarato
#
# `description` è testo per l'utente del tool: informativo, mai categorico né
# prescrittivo (lint di copy in corpus:validate). docs/known-limitations.md e le
# sezioni "limitazioni" del disclaimer si generano da questo file (script in S4).
# ============================================================================

exceptions:
  # --------------------------------------------------------------------------
  # Regimi correlati: gestiti come escalation (ADR 0009)
  # --------------------------------------------------------------------------
  - id: psnc_category_override
    status: gestito
    title: "Perimetro di Sicurezza Nazionale Cibernetica (PSNC)"
    description: "Per un soggetto inserito nel PSNC i servizi PSNC sono categorizzati d'ufficio e il procedimento ordinario non si applica a quei servizi. Lo strumento riconosce l'inserimento nel PSNC e indirizza la valutazione a un consulente qualificato, senza valutare il regime nel merito."
    citations: [det_acn_155238_2026_art_5, dl_105_2019_art_1_c_2_bis]
    applies_to: [psnc]

  # ADR 0014: nessun settore del corpus instrada al regime DORA (art. 3 c. 14 riservato
  # ai settori 3 e 4 dell'Allegato I). Voce del meta del regime, oggi non gestita.
  - id: dora_massive_disapplication
    status: non_gestito
    title: "Settore bancario e infrastrutture dei mercati finanziari (art. 3 c. 14)"
    description: "Ai soggetti essenziali o importanti dei settori 3 (settore bancario) e 4 (infrastrutture dei mercati finanziari) dell'Allegato I non si applicano l'art. 17 e i Capi IV e V del decreto; per questi soggetti si applica il Regolamento (UE) 2022/2554, noto come DORA (art. 3 c. 14 D.Lgs. 138/2024). Questi settori non sono tra quelli valutati dallo strumento in questa versione."
    citations: [dlgs_138_2024_art_3_c_14, faq_amb_no_2]
    applies_to: [dora]

  - id: cloud_pa_model_substitution
    status: gestito
    title: "Dati e servizi classificati dalla PA (Regolamento Cloud)"
    description: "Per i soggetti che hanno svolto la classificazione dei propri dati e servizi ai sensi dell'art. 3 del Regolamento Cloud per la PA si applica il modello Cloud PA (ordinari, critici, strategici) in luogo del modello di categorizzazione NIS (art. 4 Det. ACN 155238/2026). Lo strumento riconosce il caso nel percorso della pubblica amministrazione e indirizza la valutazione a un consulente qualificato, senza valutare il regime nel merito."
    citations: [dd_acn_21007_24_art_3, det_acn_155238_2026_art_4]
    applies_to: [cloud_pa, pubblica_amministrazione]

  # --------------------------------------------------------------------------
  # Soggetti critici (ADR 0015)
  # --------------------------------------------------------------------------
  - id: soggetti_critici_dlgs_134_2024_art_3_c_5_lett_a
    status: gestito
    title: "Soggetti critici (D.Lgs. 134/2024)"
    description: "Per un soggetto individuato come soggetto critico ai sensi del D.Lgs. 134/2024 il decreto NIS si applica indipendentemente dalla dimensione e il soggetto è considerato essenziale (art. 3 c. 5 lett. a) e art. 6 c. 1 lett. b) D.Lgs. 138/2024). Lo strumento chiede se l'individuazione è avvenuta e ne tiene conto nell'esito; non valuta gli obblighi della disciplina dei soggetti critici, distinta da quella NIS2."
    citations: [dlgs_138_2024_art_3_c_5_lett_a, dlgs_138_2024_art_6_c_1_lett_b, faq_amb_no_1, dlgs_134_2024]
    applies_to: [cloud_computing, energia_elettrica, pubblica_amministrazione]

  # --------------------------------------------------------------------------
  # Domande comuni dora e cloud_pa come segnali (ADR 0014)
  # --------------------------------------------------------------------------
  - id: dora_entita_finanziaria_fuori_settori_3_4
    status: segnalato
    title: "Entità finanziarie DORA fuori dai settori 3 e 4 dell'Allegato I"
    description: "L'art. 3 c. 14 D.Lgs. 138/2024 esclude l'art. 17 e i Capi IV e V del decreto solo per i soggetti dei settori 3 (settore bancario) e 4 (infrastrutture dei mercati finanziari) dell'Allegato I. Per un'entità finanziaria regolata dal Regolamento (UE) 2022/2554 che rientra nell'ambito NIS per un altro settore, la Det. ACN 127437/2026 prevede esoneri limitati agli adempimenti sulla piattaforma ACN (referente CSIRT, art. 7 c. 6; parte dell'aggiornamento annuale, art. 16 c. 13; elencazione e categorizzazione delle attività, art. 20 c. 6), mentre i Capi IV e V restano applicabili secondo il testo dell'art. 3 c. 14. L'esito indicato segue le regole del settore; il caso va approfondito con un consulente qualificato."
    citations:
      - dlgs_138_2024_art_3_c_14
      - det_piattaforma_127437_2026_art_7_c_6
      - det_piattaforma_127437_2026_art_16_c_13
      - det_piattaforma_127437_2026_art_20_c_6
      - faq_amb_no_2
    applies_to: [cloud_computing, energia_elettrica, dora]

  - id: dora_soggetti_esentati_art_3_c_15
    status: segnalato
    title: "Soggetti esentati dall'ambito del Regolamento DORA (art. 3 c. 15)"
    description: "Il decreto non si applica ai soggetti esentati dall'ambito di applicazione del Regolamento (UE) 2022/2554 (art. 3 c. 15 D.Lgs. 138/2024). Lo strumento non valuta questa esenzione: se il caso è pertinente, l'esito va riesaminato con un consulente qualificato."
    citations: [dlgs_138_2024_art_3_c_15]
    applies_to: [cloud_computing, energia_elettrica, dora]

  - id: cloud_pa_fornitore_qualificato_a1_8_2
    status: segnalato
    title: "Fornitori cloud qualificati per la PA (Regolamento Cloud)"
    description: "Secondo la FAQ ACN A1.8.2, i fornitori di servizi cloud qualificati ai sensi del Regolamento Cloud (Decreto Direttoriale ACN n. 21007/24) che superano i massimali delle piccole imprese rientrano nell'ambito NIS come fornitori di servizi di cloud computing (Allegato I, punto 8). La sostituzione del modello di categorizzazione prevista dall'art. 4 della Det. ACN 155238/2026 riguarda i soggetti che hanno svolto la classificazione dei propri dati e servizi, cioè le pubbliche amministrazioni (FAQ CAT.8): per il fornitore l'esito segue le regole ordinarie del settore."
    citations: [faq_a1_8_2, det_acn_155238_2026_art_4, faq_cat_8]
    applies_to: [cloud_computing, cloud_pa]

  # --------------------------------------------------------------------------
  # Pubblica amministrazione (ADR 0011)
  # --------------------------------------------------------------------------
  - id: pa_esclusioni_sicurezza_nazionale_art_4_c_3
    status: segnalato
    title: "Esclusioni di sicurezza nazionale (art. 4 D.Lgs. 138/2024) per attività"
    description: "Il decreto non si applica agli enti, organi e articolazioni della pubblica amministrazione che operano nei settori della pubblica sicurezza, della difesa nazionale o dell'attività di contrasto, agli organismi di informazione per la sicurezza e all'ACN (art. 4 c. 3). Lo strumento non valuta l'ambito di attività del soggetto: se il caso è pertinente, l'esito va riesaminato con un consulente qualificato."
    citations: [dlgs_138_2024_art_4_c_3]
    applies_to: [pubblica_amministrazione]

  - id: pa_organi_costituzionali_capo_v_art_4_c_2
    status: segnalato
    title: "Organi costituzionali e di rilievo costituzionale: Capo V non applicabile"
    description: "Agli organi costituzionali e di rilievo costituzionale non si applicano le previsioni del Capo V del decreto, dedicato a vigilanza ed esecuzione (art. 4 c. 2, seconda parte). Lo strumento non modella questa differenza: l'esito sull'ambito resta quello indicato, mentre le conseguenze in termini di vigilanza vanno approfondite con un consulente qualificato."
    citations: [dlgs_138_2024_art_4_c_2]
    applies_to: [pubblica_amministrazione]

  - id: pa_qualifica_elevabile_art_6_c_2
    status: segnalato
    title: "Qualifica di soggetto importante elevabile a essenziale"
    description: "Per le amministrazioni delle lettere b), c) e d) dell'Allegato III la qualifica di soggetto importante deriva dall'art. 6 c. 3; la qualifica può essere elevata a essenziale con individuazione dell'ACN (art. 6 c. 2). Lo strumento non può conoscere un'individuazione di questo tipo."
    citations: [dlgs_138_2024_art_6_c_2, dlgs_138_2024_art_6_c_3]
    applies_to: [pubblica_amministrazione]

  - id: pa_categorie_aggiunte_dpcm_art_3_c_7
    status: segnalato
    title: "Ulteriori categorie di PA individuate con DPCM"
    description: "Uno o più decreti del Presidente del Consiglio dei ministri possono individuare ulteriori categorie di pubbliche amministrazioni a cui si applica il decreto, adeguando l'elenco dell'Allegato III (art. 3 c. 7 e art. 40 c. 2 lett. b). Lo strumento considera solo le categorie dell'Allegato III: un soggetto pubblico che non vi rientra potrebbe essere compreso in una categoria aggiunta successivamente."
    citations: [dlgs_138_2024_art_3_c_7, dlgs_138_2024_art_40_c_2_lett_b]
    applies_to: [pubblica_amministrazione]

  - id: pa_lett_d_cumulo_l90_non_attestato
    status: segnalato
    title: "Cumulo con la Legge 90/2024 per gli altri soggetti pubblici (lett. d)"
    description: "Per le amministrazioni della lettera d) dell'Allegato III lo strumento non segnala il cumulo con il perimetro della Legge 90/2024: l'appartenenza a quel perimetro non è attestata nelle fonti disponibili. La verifica va condotta con un consulente qualificato."
    citations: [l90_2024_art_1_c_1, dlgs_138_2024_allegato_III]
    applies_to: [pubblica_amministrazione]

  # --------------------------------------------------------------------------
  # Inventario del 2026-10-28 (docs/verifications/2026-10-28-cloud-energia-dora.md, punto 6)
  # --------------------------------------------------------------------------
  - id: individuazione_acn_art_3_c_9
    status: segnalato
    title: "Soggetti individuati dall'ACN indipendentemente dalla dimensione (art. 3 c. 9)"
    description: "Il decreto si applica anche, indipendentemente dalla dimensione, ai soggetti dei settori e delle tipologie degli Allegati I-IV individuati dall'ACN secondo le procedure dell'art. 3 c. 13, quando ricorre uno dei criteri dell'art. 3 c. 9 (ad esempio unico fornitore nazionale di un servizio essenziale, o elemento sistemico della catena di approvvigionamento di soggetti essenziali o importanti). L'individuazione è notificata al soggetto. Lo strumento non può conoscerla: un soggetto sotto le soglie dimensionali potrebbe comunque rientrare."
    citations: [dlgs_138_2024_art_3_c_9, dlgs_138_2024_art_3_c_13, dlgs_138_2024_art_6_c_2]
    applies_to: [cloud_computing, energia_elettrica]

  - id: imprese_collegate_art_3_c_10
    status: segnalato
    title: "Imprese collegate a un soggetto essenziale o importante (art. 3 c. 10)"
    description: "Il decreto si applica, indipendentemente dalla dimensione, all'impresa collegata a un soggetto essenziale o importante che soddisfa almeno uno dei criteri dell'art. 3 c. 10, ad esempio se detiene o gestisce sistemi informativi e di rete da cui dipende la fornitura dei servizi di quel soggetto, o gli fornisce servizi TIC o di sicurezza. Lo strumento non valuta i rapporti di gruppo: un soggetto sotto le soglie dimensionali potrebbe comunque rientrare."
    citations: [dlgs_138_2024_art_3_c_10, dlgs_138_2024_art_6_c_2]
    applies_to: [cloud_computing, energia_elettrica]

  - id: energia_regime_transitorio_ose
    status: segnalato
    title: "Regime transitorio degli ex operatori di servizi essenziali (art. 5 Det. ACN 379907/2025)"
    description: "Secondo l'art. 5 della Det. ACN 379907/2025, i soggetti già operatori di servizi essenziali ai sensi del D.Lgs. 65/2018 mantengono, limitatamente ai sistemi informativi e di rete già individuati in quel quadro, le misure tecniche e organizzative già adottate, salvo contrasti con il decreto NIS. Il regime riguarda le misure, non l'ambito: l'esito indicato non cambia, e lo strumento non chiede se il soggetto era un operatore di servizi essenziali."
    citations: [det_acn_379907_2025_art_5]
    applies_to: [energia_elettrica]

  - id: cloud_stabilimento_principale_multi_ue
    status: segnalato
    title: "Fornitori cloud con stabilimenti in più Stati membri (art. 5 D.Lgs. 138/2024)"
    description: "I fornitori di servizi di cloud computing sono soggetti alla giurisdizione dello Stato membro in cui hanno lo stabilimento principale nell'Unione; la giurisdizione nazionale ricorre, tra l'altro, se lo stabilimento principale è in Italia o se il soggetto, senza stabilimenti nell'Unione, ha designato il rappresentante in Italia (art. 5 D.Lgs. 138/2024). Lo strumento non valuta lo stabilimento principale: per un soggetto con stabilimenti in più Stati membri l'esito va riesaminato con un consulente qualificato."
    citations: [dlgs_138_2024_art_5]
    applies_to: [cloud_computing]

  - id: prosumer_definizione_cliente_attivo
    status: segnalato
    title: "Definizione di cliente attivo non attestata"
    description: "La FAQ ACN A1.1.a.4 esclude dall'ambito le organizzazioni che rispondono ai requisiti della definizione di «clienti attivi» (direttiva (UE) 2019/944, art. 2, punto 8) e non svolgono altre attività riconducibili agli Allegati I e II. Il testo di quella definizione non è tra le fonti verificate dallo strumento: l'esito dipende dalla risposta fornita e va confermato con un consulente qualificato."
    citations: [faq_a1_1_a_4]
    applies_to: [energia_elettrica]

  - id: psnc_cloud_pa_precedenza_non_attestata
    status: segnalato
    title: "PSNC e Cloud PA insieme: precedenza non indicata dalle fonti"
    description: "Per un'amministrazione inserita nel PSNC che ha anche classificato i propri dati e servizi ai sensi del Regolamento Cloud, le fonti disponibili non indicano quale disciplina prevalga tra l'attribuzione d'ufficio della categoria «alto» ai servizi PSNC (art. 5 Det. ACN 155238/2026) e la sostituzione del modello di categorizzazione (art. 4). Lo strumento indirizza il caso a un consulente qualificato; l'ordine con cui i due regimi sono elencati non indica una precedenza."
    citations: [det_acn_155238_2026_art_4, det_acn_155238_2026_art_5]
    applies_to: [pubblica_amministrazione, psnc, cloud_pa]

  - id: allegato_iv_individuazione_art_3_c_8
    status: segnalato
    title: "Tipologie dell'Allegato IV: rientro solo su individuazione dell'ACN"
    description: "I soggetti delle tipologie dell'Allegato IV (trasporto pubblico locale, istituti di istruzione che svolgono attività di ricerca, soggetti che svolgono attività di interesse culturale, società in house, partecipate o a controllo pubblico) rientrano nel decreto, indipendentemente dalla dimensione, solo se individuati dall'ACN su proposta delle autorità di settore, con notifica al soggetto (art. 3 cc. 8 e 13 D.Lgs. 138/2024). Lo strumento non può determinare questa individuazione."
    # Corpus 0.6.1: A4.1 (meccanismo) e A4.2 (tipologie) al posto di A4.3.4 (solo soggetti
    # culturali) e della pagina FAQ nel suo insieme.
    citations: [dlgs_138_2024_art_3_c_8, dlgs_138_2024_art_3_c_13, faq_a4_1, faq_a4_2]
    applies_to: [pubblica_amministrazione]

  # Corpus 0.6.1: chiarimenti A4.3.x solo per il profilo "attivita' di interesse culturale"
  - id: allegato_iv_attivita_culturale_criteri_mic
    status: segnalato
    title: "Soggetti che svolgono attività di interesse culturale: criteri della proposta del Ministero della Cultura"
    description: "Per i soggetti che svolgono attività di interesse culturale, la FAQ ACN A4.3.3 indica gli elementi su cui si basa la proposta di individuazione del Ministero della Cultura: rilevanza dell'attività culturale, dipendenza critica dalle tecnologie dell'informazione e della comunicazione, impatto potenziale di un incidente informatico. La FAQ A4.3.4 precisa che per questa tipologia non valgono criteri dimensionali e che la valutazione è qualitativa e funzionale. Questi chiarimenti riguardano solo i soggetti culturali; lo strumento non valuta questi elementi."
    citations: [faq_a4_3_3, faq_a4_3_4]
    applies_to: [pubblica_amministrazione]

  - id: pa_asl_identita_sanitaria
    status: segnalato
    title: "Aziende sanitarie locali: identità nel settore sanitario non valutata"
    description: "Le Aziende sanitarie locali che erogano servizi di assistenza sanitaria sono riconducibili anche al settore sanitario dell'Allegato I, come prestatori di assistenza sanitaria: in questa veste sono soggetti importanti, ed essenziali se superano i massimali della media impresa (FAQ A3.c.4.1). Lo strumento valuta l'identità di amministrazione locale (Allegato III lett. c) e non il settore sanitario."
    citations: [faq_a3_c_4_1, faq_a3_c_4_5]
    applies_to: [pubblica_amministrazione]

  - id: pa_prerequisito_istat_s13
    status: segnalato
    title: "Inclusione nell'elenco ISTAT delle amministrazioni pubbliche"
    description: "Il rientro delle pubbliche amministrazioni dell'Allegato III presuppone che il soggetto sia tra le amministrazioni pubbliche di cui all'art. 1 c. 3 L. 196/2009, cioè nell'elenco ISTAT delle amministrazioni pubbliche (art. 3 c. 6 D.Lgs. 138/2024). Lo strumento non verifica l'inclusione nell'elenco, che va confermata con un consulente qualificato."
    citations: [l_196_2009_art_1_c_3, dlgs_138_2024_art_3_c_6]
    applies_to: [pubblica_amministrazione]

  # --------------------------------------------------------------------------
  # Non gestiti: fuori dal perimetro dello strumento, dichiarati
  # --------------------------------------------------------------------------
  - id: safeguard_dimensional_dpcm_221
    status: non_gestito
    title: "Salvaguardia dimensionale (DPCM 221/2024)"
    description: "L'art. 3 c. 4 D.Lgs. 138/2024 consente di non applicare il consolidamento dimensionale con le imprese collegate quando non è proporzionato, tenuto conto dell'indipendenza del soggetto in termini di sistemi informativi e di rete e di servizi forniti; l'ACN applica questa salvaguardia dimensionale secondo i criteri stabiliti con DPCM (art. 3 c. 12; DPCM 221/2024). Lo strumento non la valuta."
    citations: [dlgs_138_2024_art_3_c_4, dlgs_138_2024_art_3_c_12, dpcm_221_2024]
    applies_to: [cloud_computing, energia_elettrica]

  - id: dimensione_autodichiarata
    status: non_gestito
    title: "Categoria dimensionale indicata dall'utente"
    description: "La categoria dimensionale (micro o piccola, media, grande impresa) è indicata dall'utente secondo la Raccomandazione 2003/361/CE, come riportata dalla FAQ ACN AMB.DI.1. Lo strumento non la calcola a partire da effettivi, fatturato e totale di bilancio."
    citations: [faq_amb_di_1, racc_ue_2003_361]
    applies_to: [cloud_computing, energia_elettrica]

  - id: consolidamento_di_gruppo
    status: non_gestito
    title: "Dati dimensionali delle imprese collegate o associate"
    description: "Per un soggetto che fa parte di un gruppo, i dati dimensionali possono andare sommati con quelli delle imprese collegate o associate (art. 3 c. 4 D.Lgs. 138/2024, che rinvia all'art. 6 par. 2 dell'allegato della Raccomandazione 2003/361/CE). Lo strumento non esegue questo calcolo: usa la categoria indicata dall'utente."
    citations: [dlgs_138_2024_art_3_c_4, racc_ue_2003_361]
    applies_to: [cloud_computing, energia_elettrica]

  - id: confine_50_43
    status: non_gestito
    title: "Soglie di fatturato e di bilancio della media impresa"
    description: "Per la media impresa contano gli effettivi e almeno uno dei due dati contabili: fatturato annuo fino a 50 milioni di euro oppure totale di bilancio annuo fino a 43 milioni di euro (Raccomandazione 2003/361/CE, come riportata dalla FAQ ACN AMB.DI.1). Quando i due dati cadono su lati diversi delle soglie la classificazione richiede attenzione; lo strumento non la calcola e usa la categoria indicata dall'utente."
    citations: [faq_amb_di_1, racc_ue_2003_361]
    applies_to: [cloud_computing, energia_elettrica]

  - id: copertura_settoriale_parziale
    status: non_gestito
    title: "Settori e tipologie valutati dallo strumento"
    description: "Lo strumento valuta tre ambiti: il sottosettore energia elettrica (Allegato I, punto 1, lettera a), i fornitori di servizi di cloud computing (Allegato I, punto 8) e le pubbliche amministrazioni dell'Allegato III. Gli altri settori, sottosettori e tipologie degli Allegati I, II e IV non sono valutati."
    citations: [dlgs_138_2024_art_3, dlgs_138_2024_allegato_I, dlgs_138_2024_allegato_III]
    applies_to: [cloud_computing, energia_elettrica, pubblica_amministrazione]

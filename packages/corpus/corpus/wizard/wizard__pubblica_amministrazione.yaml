# ============================================================================
# Wizard: Pubblica Amministrazione — MODELLO DI INTERAZIONE
# Referenzia il blocco comune wizard__disambiguation.yaml + domande specifiche
# ============================================================================
#
# NOTE DI FLUSSO (specificita' PA rispetto a Cloud/Energia):
# - NIENTE domanda dimensione: la PA e' size-blind (rientro a prescindere).
#   Da corpus 0.6.0 (ADR 0015) il percorso PA ha la fase standard_identification
#   per la sola domanda comune soggetto_critico; dimension e' esclusa
#   (excluded_common_questions), per struttura e non per condizione.
# - NIENTE domanda "pertinenza pubblica" generica: per la PA e' implicita.
#   Il caso in-house/partecipate e' gestito via il canale Allegato IV, non
#   via la domanda pertinenza pubblica di Cloud/Energia.
# - NIENTE domanda ISTAT (strada 2): l'inclusione nella Lista S13 e' assunta
#   e dichiarata nei reasoning_trace, non chiesta all'utente.
# - Cloud PA (corpus 0.5.0, C5; ADR 0014): la domanda comune cloud_pa e' per i
#   fornitori e non e' posta alla PA (excluded_common_questions); per la PA conta la
#   domanda classificazione_cloud_pa (trigger dell'override).
# - PSNC (ADR 0014): la domanda comune psnc instrada al regime PSNC anche per la PA.
# ============================================================================

meta:
  wizard_id: pubblica_amministrazione
  references_common_block: disambiguation
  sector_data: sectors/sectors__pubblica_amministrazione.yaml

flow_order:
  - disambiguation       # PSNC (possibile per PA centrali/ASL), DORA (di norma no)
  - sector_specific
  - standard_identification   # solo soggetto_critico (ADR 0015)

# Domande del blocco comune non poste alla PA:
# - dimension: settore size_blind (art. 3 c. 6 D.Lgs. 138/2024; ADR 0015);
# - cloud_pa: domanda per i fornitori; per la PA conta classificazione_cloud_pa (ADR 0014).
excluded_common_questions:
  - dimension
  - cloud_pa

sector_specific_questions:
  # Domanda principale: quale categoria dell'Allegato III
  - id: categoria_pa
    kind: single_select
    label_it: "A quale categoria dell'Allegato III appartiene il soggetto?"
    help_text_it: |
      Le categorie riprendono l'Allegato III del D.Lgs. 138/2024, che riguarda
      le pubbliche amministrazioni incluse nell'elenco ISTAT (art. 1 c. 3 L. 196/2009).
      Un ente di ricerca o un ente culturale incluso nell'elenco ISTAT si indica
      nella lettera d). L'ultima opzione è per i soggetti pubblici che non si
      ritrovano in nessuna delle categorie precedenti.
    options:
      - id: a
        label_it: "Amministrazione centrale (lett. a): Organi costituzionali e di rilievo costituzionale; Presidenza del Consiglio dei ministri e Ministeri; Agenzie fiscali; Autorità amministrative indipendenti"
      # Soggetti che l'art. 4 c. 2 non ricomprende tra le PA dell'art. 3 cc. 6-7
      - id: esclusa_art_4_c_2
        label_it: "Organo escluso dall'art. 4 c. 2: Parlamento italiano, Autorità giudiziaria, Banca d'Italia, Unità di informazione finanziaria per l'Italia"
      - id: b
        label_it: "Amministrazione regionale (lett. b): Regioni e Province autonome"
      - id: c
        label_it: "Amministrazione locale (lett. c): Città metropolitane; Comuni con popolazione superiore a 100.000 abitanti; Comuni capoluoghi di regione; Aziende sanitarie locali"
      - id: d
        label_it: "Altro soggetto pubblico (lett. d): enti di regolazione dell'attività economica, enti produttori di servizi economici, enti a struttura associativa, enti produttori di servizi assistenziali, ricreativi e culturali, enti e istituzioni di ricerca, istituti zooprofilattici sperimentali"
      - id: canale_allegato_iv
        label_it: "Nessuna delle precedenti: soggetto pubblico o a partecipazione pubblica fuori dall'Allegato III (es. trasporto pubblico locale, istituto di istruzione che svolge ricerca, soggetto di interesse culturale, società in-house)"

  # Sotto-domanda condizionale: sottotipo della categoria c)
  - id: sottotipo_c
    kind: single_select
    visible_if: { input: categoria_pa, op: eq, value: c }   # ADR 0010 (era conditional_on)
    label_it: "Quale tipo di amministrazione locale?"
    help_text_it: |
      La distinzione è rilevante: le ASL hanno una doppia identità (sono anche
      prestatori di assistenza sanitaria) e la registrazione indica le tipologie
      di entrambe le identità.
    options:
      - id: citta_metropolitana
        label_it: "Città metropolitana"
      - id: comune_oltre_100k
        label_it: "Comune con più di 100.000 abitanti"
      - id: comune_capoluogo
        label_it: "Comune capoluogo di Regione"
      - id: asl
        label_it: "Azienda Sanitaria Locale (ASL)"
        on_selected:
          activates_signals: [cross_sector_asl_sanitario]
          notices: [pa_asl_identita_sanitaria]

  # Sotto-domanda condizionale: sottotipo della categoria d) (corpus 0.5.0)
  - id: sottotipo_d
    kind: single_select
    visible_if: { input: categoria_pa, op: eq, value: d }
    label_it: "Quale tipo di soggetto pubblico della lettera d)?"
    help_text_it: |
      Le voci riprendono l'Allegato III lett. d) del D.Lgs. 138/2024.
    options:
      - id: enti_regolazione_attivita_economica
        label_it: "Enti di regolazione dell'attività economica"
      - id: enti_produttori_servizi_economici
        label_it: "Enti produttori di servizi economici"
      - id: enti_struttura_associativa
        label_it: "Enti a struttura associativa"
      - id: enti_servizi_assistenziali_ricreativi_culturali
        label_it: "Enti produttori di servizi assistenziali, ricreativi e culturali"
      - id: enti_istituzioni_ricerca
        label_it: "Enti e Istituzioni di ricerca"
      - id: istituti_zooprofilattici_sperimentali
        label_it: "Istituti zooprofilattici sperimentali"
    citations: [dlgs_138_2024_allegato_III]

  # Sotto-domanda condizionale: profilo del canale Allegato IV
  - id: profilo_allegato_iv
    kind: single_select
    visible_if: { input: categoria_pa, op: eq, value: canale_allegato_iv }   # ADR 0010 (era conditional_on)
    label_it: "Quale tipo di soggetto pubblico?"
    help_text_it: |
      Questi soggetti possono rientrare nel perimetro NIS tramite individuazione
      governativa (Allegato IV). Non è un rientro automatico: dipende da una
      determinazione dell'autorità competente. Lo strumento può solo segnalarti
      questa possibilità.
    options:
      - id: tpl
        label_it: "Trasporto pubblico locale"
        activates_signals: [allegato_iv_individuazione, l90_cumulo]
      - id: istituto_ricerca
        label_it: "Istituto di istruzione che svolge ricerca"
        activates_signals: [allegato_iv_individuazione]
      - id: attivita_culturale
        label_it: "Soggetto che svolge attività di interesse culturale"
        activates_signals: [allegato_iv_individuazione]
      # Corpus 0.6.1: l90_cumulo solo per le societa' in house dei soggetti elencati
      # dall'art. 1 c. 1 L. 90/2024 che forniscono i servizi li' indicati (stesso ID di
      # opzione di wizard__cloud_computing.yaml); le altre in-house non lo attivano.
      - id: inhouse_soggetto_l90
        label_it: "Società in house di uno dei soggetti elencati dall'art. 1 c. 1 L. 90/2024 (PA centrali, Regioni e Province autonome, Città metropolitane, Comuni con più di 100.000 abitanti o capoluoghi di regione, società di trasporto pubblico indicate dalla norma, Aziende sanitarie locali) che fornisce servizi informatici, servizi di trasporto tra quelli indicati dalla norma, servizi di raccolta, smaltimento o trattamento di acque reflue o di gestione dei rifiuti"
        activates_signals: [allegato_iv_individuazione, cross_sector_inhouse_all_iv, l90_cumulo]
      - id: societa_inhouse
        label_it: "Altra società in-house, partecipata o controllata da ente pubblico"
        # Per gli in-house il canale All. IV coincide con il signal in-house;
        # attiviamo entrambi gli id che puntano allo stesso fenomeno (l'engine
        # deduplica in fase di rendering del verdetto).
        activates_signals: [allegato_iv_individuazione, cross_sector_inhouse_all_iv]

  # Cloud PA nel percorso PA (C5, corpus 0.5.0): trigger dell'override del settore.
  # La domanda comune cloud_pa di wizard__disambiguation.yaml resta per i fornitori.
  - id: classificazione_cloud_pa
    kind: binary
    label_it: "L'amministrazione ha classificato i propri dati e servizi digitali ai sensi del Regolamento Cloud per la PA (Decreto Direttoriale ACN n. 21007/24, art. 3)?"
    help_text_it: |
      La classificazione distingue dati e servizi digitali in ordinari, critici
      e strategici. Se l'amministrazione non ha effettuato la classificazione,
      rispondi «no».
    citations: [dd_acn_21007_24_art_3, det_acn_155238_2026_art_4]

# ============================================================================
# Intersezione PSNC + Cloud PA (ADR 0014: dal blocco comune al percorso PA)
# ============================================================================
multi_regime_intersection:
  # Se PSNC e Cloud PA sono entrambi positivi, l'ordine di precedenza tra
  # l'automatismo "alto" PSNC (art. 5) e la sostituzione di modello Cloud PA
  # (art. 4) non e' esplicitato nelle fonti (STATUS 6). Il decision engine produce
  # escalate_to_advisor invece di tentare di risolvere; regimeRouting elenca i due
  # regimi nell'ordine degli override del file di settore, che non e' una precedenza.
  - trigger: psnc == yes AND classificazione_cloud_pa == yes
    outcome: escalate_to_advisor
    verdict_outcome: ambiguous   # vincolo fisso: escalate_to_advisor -> sempre ambiguous (l'engine copia senza inferenza)
    reasoning_trace: "L'amministrazione appare contemporaneamente in perimetro PSNC e tra i soggetti che hanno classificato dati e servizi ai sensi del Regolamento Cloud. L'ordine di precedenza tra l'automatismo 'alto' PSNC (art. 5 Det. ACN 155238/2026) e la sostituzione di modello Cloud PA (art. 4) non è esplicitato nelle fonti normative disponibili. Consulenza qualificata necessaria, con eventuale interlocuzione diretta ACN."
    citations: [det_acn_155238_2026_art_4, det_acn_155238_2026_art_5]
    notices: [psnc_cloud_pa_precedenza_non_attestata]

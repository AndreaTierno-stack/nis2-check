# ============================================================================
# Wizard: Cloud Computing — MODELLO DI INTERAZIONE
# Referenzia il blocco comune wizard__disambiguation.yaml + domande specifiche
# Gli id citati qui (signal, condition_ref) devono esistere nel modello dati
# ============================================================================

meta:
  wizard_id: cloud_computing
  references_common_block: disambiguation
  sector_data: sectors/sectors__cloud_computing.yaml

# Ordine del flusso: disambiguazione comune -> domande settore -> identificazione standard
flow_order:
  - disambiguation          # blocco comune (PSNC, DORA, Cloud PA)
  - sector_specific         # domande sotto
  - standard_identification # dimensione (size-cap)

sector_specific_questions:
  - id: pertinenza_pubblica_cloud
    kind: binary_with_conditional_followup
    label_it: "Il soggetto è un ente pubblico o ha capitale, quote o partecipazioni pubbliche?"
    help_text_it: |
      Rispondi "sì" se il soggetto è una pubblica amministrazione, oppure se
      ha tra i propri soci (o quote) un ente pubblico (Stato, Regione, Comune,
      Provincia, ASL, eccetera), in qualunque misura.
    conditional_followup:
      id: tipo_partecipazione_pubblica   # stesso ID di wizard__energia_elettrica.yaml; opzione in piu': inhouse_soggetto_l90 (0.6.0)
      trigger_on: "yes"
      label_it: "Quale tipo di partecipazione pubblica?"
      kind: single_select
      # C-E5 (corpus 0.6.0): l90_cumulo solo per le societa' in house dei soggetti
      # elencati dall'art. 1 c. 1 L. 90/2024, che vi comprende le rispettive societa' in
      # house che forniscono servizi informatici.
      options:
        - id: ente_pubblico
          label_it: "Ente pubblico (PA centrale, Regione, Comune, ASL, eccetera)"
          activates_signals: [cross_sector_pa]
        - id: inhouse_soggetto_l90
          label_it: "Società in house di uno dei soggetti elencati dall'art. 1 c. 1 L. 90/2024 (PA centrali, Regioni e Province autonome, Città metropolitane, Comuni con più di 100.000 abitanti o capoluoghi di regione, società di trasporto pubblico indicate dalla norma, Aziende sanitarie locali)"
          activates_signals: [l90_cumulo, cross_sector_inhouse_all_iv]
        - id: capitale_prevalente
          label_it: "Altra società con capitale interamente o prevalentemente pubblico (in-house di altri enti, controllata, partecipata di maggioranza)"
          activates_signals: [cross_sector_inhouse_all_iv]
        - id: capitale_minoritario
          label_it: "Società con partecipazione pubblica minoritaria (sotto il 50%)"
          activates_signals: []
          note_it: "La partecipazione minoritaria non attiva, di norma, signal di cumulo L. 90; verifica con consulente in caso di partecipazione qualificata o controllo congiunto."

  - id: fornisce_servizi_gestiti_b2b
    kind: binary
    # C-C2 (corpus 0.6.0): criterio dell'interconnessione diretta (FAQ A1.9.2, ripreso
    # in A1.9.3) e copy sulla registrazione (det. piattaforma art. 11 c. 2). Corpus 0.6.1:
    # registrazione su art. 7 c. 1 lett. d) del decreto e art. 11 c. 2 lett. g) della Det.;
    # tipologie dell'Allegato I p. 9 su A1.9.1 (lint KB del 2026-10-30, V2-V4).
    label_it: "Il soggetto fornisce anche servizi gestiti o servizi di sicurezza gestiti ad altre organizzazioni (B2B), tramite un'interconnessione diretta tra la rete del fornitore e quella del cliente?"
    help_text_it: |
      Secondo la FAQ ACN A1.9.2, l'assistenza o l'amministrazione attiva dei
      servizi gestiti è svolta tramite un'interconnessione diretta tra la rete
      del fornitore e quella del cliente: ad esempio domini federati, oppure
      accesso remoto del fornitore ai sistemi del cliente con dispositivi del
      fornitore. Se è il caso, il soggetto potrebbe rientrare anche come
      fornitore di servizi gestiti o di servizi di sicurezza gestiti (Allegato I
      p. 9); la registrazione sulla piattaforma ACN indica tutte le tipologie
      pertinenti.
    on_yes:
      activates_signals: [cross_sector_cloud_msp]
    citations: [faq_a1_9_1, faq_a1_9_2, faq_a1_9_3, faq_a1_9_4, dlgs_138_2024_art_7_c_1_lett_d, det_piattaforma_127437_2026_art_11_c_2_lett_g]

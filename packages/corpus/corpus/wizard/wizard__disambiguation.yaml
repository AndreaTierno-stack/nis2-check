# ============================================================================
# Domande binarie di disambiguazione di regime — COMUNI a tutti i settori
# Referenziate dai file wizard/wizard__<settore>.yaml
# Ordine di esecuzione: queste 3 domande precedono l'identificazione standard
# Ospita anche le domande comuni della fase standard_identification
# (sezione in fondo al file): non esiste un file dedicato.
# ============================================================================
#
# ADR 0014 (corpus 0.6.0): in v0.1 instradano a un regime solo psnc (cloud,
# energia, PA) e, nel solo percorso PA, la domanda classificazione_cloud_pa del
# wizard PA. Le domande dora e cloud_pa restano come segnali: con "si'" aggiungono
# avvisi del catalogo eccezioni (on_yes.notices), l'esito segue le regole del settore.
# ============================================================================

meta:
  block_id: disambiguation
  execution_order: pre_standard_identification
  description_it: |
    Tre domande binarie iniziali sui regimi correlati. La domanda PSNC instrada
    al regime PSNC (sovrascrive la categoria dei servizi PSNC); le domande DORA
    e Cloud PA aggiungono al verdetto un avviso, senza instradare.

questions:
  - id: psnc
    kind: binary
    # Corpus 0.13.0 (review F10): testo limitato a cio' che il registro attesta
    # (dl_105_2019_art_1_c_2_bis); tolte la stima del numero di soggetti e i riferimenti
    # agli organi che comunicano l'inserimento, non attestati nella KB.
    label_it: "Il soggetto è stato inserito nel Perimetro di Sicurezza Nazionale Cibernetica (PSNC) ai sensi dell'art. 1 c. 2-bis del D.L. 105/2019?"
    help_text_it: |
      L'inserimento nel PSNC avviene con un atto formale. Se il soggetto non
      risulta inserito nel PSNC con un atto formale, rispondi "no".
    on_yes:
      effect: category_override
      reference: regimes/psnc.yaml
    citations: [dl_105_2019_art_1_c_2_bis, det_acn_155238_2026_art_5]

  # ADR 0014: segnale, non gate. L'art. 3 c. 14 D.Lgs. 138/2024 riguarda solo i
  # settori 3 e 4 dell'Allegato I, che non sono tra i settori valutati dallo strumento.
  - id: dora
    kind: binary
    label_it: "Il soggetto è un'entità finanziaria regolata dal Regolamento (UE) 2022/2554 (DORA), ad esempio un ente creditizio (banca) o un gestore di una sede di negoziazione?"
    help_text_it: |
      DORA è la normativa europea sulla resilienza operativa digitale del
      settore finanziario. Se il soggetto è una banca o un'infrastruttura
      dei mercati finanziari di dimensione media o grande, rispondi "sì".
    on_yes:
      notices: [dora_entita_finanziaria_fuori_settori_3_4, dora_soggetti_esentati_art_3_c_15]
    citations: [reg_ue_2022_2554, dlgs_138_2024_allegato_I, dlgs_138_2024_art_3_c_14, faq_amb_no_2]

  # ADR 0014: segnale, non gate. La sostituzione del modello (art. 4 Det. 155238/2026)
  # riguarda le PA che hanno classificato i propri dati e servizi (FAQ CAT.8): nel
  # percorso PA conta la domanda classificazione_cloud_pa. Il fornitore qualificato
  # rientra come fornitore cloud (FAQ A1.8.2).
  - id: cloud_pa
    kind: binary
    label_it: "Il soggetto eroga servizi cloud destinati a una Pubblica Amministrazione, qualificati ai sensi del Regolamento Cloud per la PA (Decreto Direttoriale ACN n. 21007/24)?"
    help_text_it: |
      Riguarda i fornitori cloud i cui servizi sono stati qualificati nel
      quadro della strategia Cloud per la PA. Se i tuoi servizi cloud sono
      destinati a clienti privati, rispondi "no".
    on_yes:
      notices: [cloud_pa_fornitore_qualificato_a1_8_2]
    citations: [faq_a1_8_2, det_acn_155238_2026_art_4, faq_cat_8]

# ============================================================================
# Identificazione standard — domande comuni (dimension da 0.3.0, soggetto_critico da 0.6.0)
# ============================================================================
# Fase standard_identification: segue disambiguation e sector_specific. Alimenta
# le qualification_rules dei settori con condition su "soggetto_critico" e "dimension".
# ADR 0015: soggetto_critico vale per tutti i settori, PA compresa (art. 3 c. 5
# lett. a) e art. 6 c. 1 lett. b) D.Lgs. 138/2024: essenziale a prescindere dalla
# dimensione). La PA non incontra dimension per struttura, non per condizione
# (ADR 0010, ADR 0015): il wizard PA la elenca in excluded_common_questions e il
# settore e' size_blind.
# Fondamento: le PA dell'Allegato III rientrano "indipendentemente dalle loro
# dimensioni" (art. 3 c. 6 D.Lgs. 138/2024, in meta.citations del settore PA).
# Il testo di aiuto deriva da FAQ AMB.DI.1 e dal concept Size-cap rule.
# BACKLOG v0.2: calcolo automatico della categoria da tre numeri (effettivi,
# fatturato, bilancio); in v0.1 l'utente seleziona la categoria.

standard_identification_questions:
  # ADR 0015: soggetti critici (D.Lgs. 134/2024). Con "si'" le regole dei settori
  # danno categorical_assessment, essenziale, indipendentemente dalla dimensione.
  - id: soggetto_critico
    phase: standard_identification
    kind: binary
    label_it: "Il soggetto è stato individuato come soggetto critico ai sensi del D.Lgs. 134/2024?"
    help_text_it: |
      Il D.Lgs. 134/2024 recepisce la direttiva (UE) 2022/2557 sulla resilienza
      dei soggetti critici. Secondo la FAQ ACN AMB.NO.1, la qualifica di soggetto
      critico si acquisisce con l'inserimento nell'elenco dei soggetti critici
      adottato con decreto del Presidente del Consiglio dei ministri, e
      dell'inclusione è data notizia al soggetto. Non riguarda le comunità
      energetiche rinnovabili (configurazioni CACER). Se il soggetto non ha ricevuto questa
      notizia, rispondi "no".
    on_yes:
      activates_signals: [cer_signal]
    citations: [dlgs_138_2024_art_3_c_5_lett_a, dlgs_138_2024_art_6_c_1_lett_b, faq_amb_no_1]

  - id: dimension
    phase: standard_identification
    kind: single_select
    label_it: "A quale categoria dimensionale appartiene il soggetto, secondo la Raccomandazione UE 2003/361/CE?"
    help_text_it: |
      La categoria si ricava da tre dati: gli effettivi (le persone occupate),
      il fatturato annuo e il totale di bilancio annuo.
      Le soglie, come riportate dalla FAQ ACN AMB.DI.1:

      | Categoria | Effettivi   | Fatturato annuo | Bilancio annuo |
      |-----------|-------------|-----------------|----------------|
      | Micro     | meno di 10  | fino a 2 M€     | fino a 2 M€    |
      | Piccola   | meno di 50  | fino a 10 M€    | fino a 10 M€   |
      | Media     | meno di 250 | fino a 50 M€    | fino a 43 M€   |

      Oltre le soglie della media impresa si parla di grande impresa.

      Come si legge la tabella: per stare in una categoria contano sempre gli
      effettivi, più almeno uno tra fatturato e bilancio (i due dati contabili
      sono alternativi). Se gli effettivi superano la soglia, oppure se la
      superano entrambi i dati contabili, il soggetto passa alla categoria
      successiva. Esempio dalla FAQ: con meno di 10 effettivi, ma fatturato e
      bilancio entrambi tra 10 e 43 M€, il soggetto risulta media impresa.

      Se il soggetto fa parte di un gruppo, i dati possono andare sommati con
      quelli delle imprese collegate o associate. In caso di dubbio sul calcolo,
      è opportuno un confronto con un consulente qualificato.
    options:
      - id: micro_or_piccola
        label_it: "Micro o piccola impresa (meno di 50 effettivi e fatturato o bilancio fino a 10 M€)"
      - id: media
        label_it: "Media impresa (non piccola; meno di 250 effettivi e fatturato fino a 50 M€ o bilancio fino a 43 M€)"
      - id: grande
        label_it: "Grande impresa (250 effettivi o più, oppure fatturato oltre 50 M€ e bilancio oltre 43 M€)"
    citations: [faq_amb_di_1, racc_ue_2003_361]

# ============================================================================
# Wizard: Energia elettrica — MODELLO DI INTERAZIONE
# Referenzia il blocco comune wizard__disambiguation.yaml + domande specifiche
# ============================================================================

meta:
  wizard_id: energia_elettrica
  references_common_block: disambiguation
  sector_data: sectors/sectors__energia_elettrica.yaml

flow_order:
  - disambiguation
  - sector_specific
  - standard_identification

# ADR 0016 amendment (corpus 0.10.0): le attivita' dichiarate del soggetto sono la
# principale e le ulteriori. Un'esclusione tipologica (outcome_mapping) riguarda una
# sola attivita' (campo activity della domanda) e decide solo se ogni attivita'
# dichiarata ha un'esclusione scattata; altrimenti resta un avviso (notices_if_demoted).
activity_inputs: [tipologia_elettrica, attivita_elettriche_ulteriori]

sector_specific_questions:
  # Prima la tipologia: il settore ha 7 tipologie con scoping diverso
  - id: tipologia_elettrica
    kind: single_select
    label_it: "Quale attività svolge principalmente il soggetto nel settore elettrico?"
    help_text_it: |
      Se il soggetto svolge più attività (es. distribuzione e vendita), la
      registrazione sulla piattaforma ACN indica tutte le tipologie pertinenti.
      Seleziona l'attività principale; ti segnaleremo le eventuali identità multiple.
    options:
      - id: tso
        label_it: "Gestione della rete di trasmissione (TSO)"
      - id: dso
        label_it: "Gestione della rete di distribuzione (DSO)"
      - id: impresa_fornitura
        label_it: "Vendita, compresa la rivendita, di energia elettrica ai clienti (fornitura)"
      - id: produttore
        label_it: "Produzione di energia elettrica"
      - id: gestore_mercato
        label_it: "Gestione del mercato elettrico (soggetto designato)"
      - id: partecipante_aggregazione
        label_it: "Aggregazione, gestione della domanda o stoccaggio"
      - id: gestore_punti_ricarica
        label_it: "Gestione di punti di ricarica per veicoli elettrici"

  # Multi-identita' intra-settore: rileva attivita' elettriche ulteriori oltre la principale
  # NOTA IMPLEMENTAZIONE: l'UI deve escludere a runtime l'opzione gia' scelta in
  # tipologia_elettrica (non si seleziona "ulteriore" cio' che e' gia' "principale").
  - id: attivita_elettriche_ulteriori
    kind: multi_select
    label_it: "Oltre all'attività principale, il soggetto ne svolge altre tra queste nel settore elettrico?"
    help_text_it: |
      Molte società elettriche sono verticalmente integrate (es. distribuzione
      e vendita insieme). La registrazione sulla piattaforma ACN indica tutte le
      tipologie pertinenti. Seleziona tutte le attività ulteriori; se non ne svolgi
      altre, lascia vuoto e prosegui.
    optional: true
    options:
      - id: tso
        label_it: "Gestione della rete di trasmissione (TSO)"
      - id: dso
        label_it: "Gestione della rete di distribuzione (DSO)"
      - id: impresa_fornitura
        label_it: "Vendita, compresa la rivendita, ai clienti (fornitura)"
      - id: produttore
        label_it: "Produzione"
      - id: gestore_mercato
        label_it: "Gestione del mercato elettrico"
      - id: partecipante_aggregazione
        label_it: "Aggregazione, gestione domanda, stoccaggio"
      - id: gestore_punti_ricarica
        label_it: "Gestione di punti di ricarica per veicoli elettrici"
    on_any_selected:
      activates_signals: [cross_sector_multi_tipologia_elettrica]

  # Follow-up PUN: pertinente solo se il soggetto e' (anche) gestore di punti di ricarica.
  # A1.1.a.3 (verificato in KB, FAQ Settori): i gestori registrati su PUN rientrano; i
  # punti vendita con ricarica non obbligati alla registrazione su PUN "non rientrano
  # automaticamente". NON e' un'esclusione categoriale -> il ramo "no" e'
  # qualitative_signal_only (verso "fuori"), non out_of_scope.
  - id: registrato_pun
    kind: single_select
    activity: gestore_punti_ricarica   # esclude solo l'attivita' di ricarica (A1.1.a.3)
    visible_if:   # ADR 0010: principale OPPURE tra le ulteriori
      any_of:
        - { input: tipologia_elettrica, op: eq, value: gestore_punti_ricarica }
        - { input: attivita_elettriche_ulteriori, op: includes, value: gestore_punti_ricarica }
    label_it: "Il soggetto è obbligato a registrarsi sul PUN (Piattaforma Unica Nazionale) come gestore di punti di ricarica, ai sensi del DM MASE n. 106 del 16/03/2023?"
    help_text_it: |
      Secondo la FAQ ACN A1.1.a.3 rientrano nella definizione della tipologia
      «gestore di un punto di ricarica» solo i soggetti obbligati a registrarsi
      sul PUN (art. 5 del DM MASE n. 106/2023); i punti vendita che offrono
      ricarica senza questo obbligo non rientrano nella definizione.
    options:
      - id: si
        label_it: "Sì, registrato o obbligato alla registrazione su PUN"
        # Corpus 0.9.0: niente outcome_mapping per "si" (era categorical_assessment /
        # likely_in_scope "provvisorio", vietato da E_OUTCOME_MAPPING_INCLUSIVE): la
        # tipologia e' confermata e l'esito viene dalle regole del settore.
        on_selected:
          citations: [faq_a1_1_a_3, dm_mase_106_2023]
      - id: "no"
        label_it: "No, non obbligato alla registrazione su PUN"
      - id: non_so
        label_it: "Non so"
    outcome_mapping:
      - answer: "no"
        # Esito invariato (corpus 0.13.0, review F08): la FAQ A1.1.a.3 esclude dalla definizione della
        # tipologia (testo verificato in raw/, KB DEC-010); l'esclusione riguarda la sola attivita' di
        # ricarica, per questo il modo resta qualitative_signal_only.
        outcome: qualitative_signal_only
        verdict_outcome: likely_out_of_scope
        notices_if_demoted: [punti_ricarica_non_pun_attivita_ulteriore]
        reasoning_trace: "Secondo la FAQ ACN A1.1.a.3 i soggetti non obbligati alla registrazione sul PUN (art. 5 del DM MASE n. 106/2023) non rientrano nella definizione della tipologia di soggetto 'gestore di un punto di ricarica'. Sulla base degli input forniti, l'analisi suggerisce la probabile esclusione dal perimetro NIS2 italiano per questa attività; il soggetto potrebbe rientrarvi per un'altra tipologia o se l'obbligo di registrazione sopravvenisse."
        citations: [faq_a1_1_a_3]
      - answer: non_so
        outcome: qualitative_signal_only
        verdict_outcome: ambiguous
        notices_if_demoted: [punti_ricarica_non_pun_attivita_ulteriore]
        reasoning_trace: "Obbligo di registrazione su PUN non noto: la qualificazione del gestore di punti di ricarica dipende da tale obbligo (A1.1.a.3, DM MASE 106/2023). Verifica con consulente qualificato."
        citations: [faq_a1_1_a_3, dm_mase_106_2023]

  # C-E2 (corpus 0.6.0): esclusione dei clienti attivi, FAQ A1.1.a.4, con le due
  # condizioni della FAQ nelle sue parole. La definizione di "clienti attivi"
  # (dir. 2019/944 art. 2 p. 8) non e' attestata: avviso di catalogo.
  # Solo se il produttore e' l'attivita' principale: se e' un'attivita' ulteriore,
  # il soggetto svolge per definizione altre attivita' dell'Allegato I.
  - id: produttore_cliente_attivo
    kind: single_select
    activity: produttore   # esclude solo l'attivita' di produzione (A1.1.a.4)
    visible_if: { input: tipologia_elettrica, op: eq, value: produttore }
    label_it: "Il soggetto risponde ai requisiti della definizione di «clienti attivi» e non svolge altre attività riconducibili agli Allegati I e II del D.Lgs. 138/2024?"
    help_text_it: |
      Secondo la FAQ ACN A1.1.a.4, la tipologia «produttori» dell'Allegato I
      non richiama la definizione di «clienti attivi» (i cosiddetti prosumer,
      ad esempio un'impresa con un impianto fotovoltaico per i propri consumi).
      Le organizzazioni che rispondono a quella definizione e non svolgono altre
      attività degli Allegati I e II non rientrano nell'ambito NIS.
    options:
      - id: si
        label_it: "Sì, entrambe le condizioni"
      - id: "no"
        label_it: "No"
    outcome_mapping:
      - answer: si
        outcome: out_of_scope
        verdict_outcome: likely_out_of_scope   # vincolo fisso: out_of_scope -> likely_out_of_scope
        reasoning_trace: "Il soggetto dichiara di rispondere ai requisiti della definizione di clienti attivi e di non svolgere altre attività riconducibili agli Allegati I e II. Secondo la FAQ ACN A1.1.a.4 queste organizzazioni non rientrano nell'ambito di applicazione del decreto NIS: sulla base degli input forniti, l'analisi suggerisce che il soggetto non rientri nel perimetro NIS2 italiano come produttore. La definizione di clienti attivi non è tra le fonti verificate dallo strumento."
        citations: [faq_a1_1_a_4]
        notices: [prosumer_definizione_cliente_attivo]
        notices_if_demoted: [prosumer_definizione_cliente_attivo]
    citations: [faq_a1_1_a_4]

  # Pertinenza pubblica: identica a Cloud (multiutility comunali sono comuni nell'energia)
  - id: pertinenza_pubblica_energia
    kind: binary_with_conditional_followup
    label_it: "Il soggetto è un ente pubblico o ha capitale, quote o partecipazioni pubbliche?"
    help_text_it: |
      Molte società elettriche locali (multiutility) hanno capitale comunale o
      regionale. Rispondi "sì" se il soggetto ha tra i propri soci un ente
      pubblico, in qualunque misura.
    conditional_followup:
      id: tipo_partecipazione_pubblica   # ID dell'input serializzato (fixture E14)
      trigger_on: "yes"
      label_it: "Quale tipo di partecipazione pubblica?"
      kind: single_select
      # C-E5 (corpus 0.6.0): nessuna opzione attiva l90_cumulo. L'art. 1 c. 1 L. 90/2024
      # comprende le societa' in house dei soggetti elencati solo se forniscono servizi
      # informatici, di trasporto, di acque reflue o di gestione dei rifiuti: l'energia
      # non c'e'.
      options:
        - id: ente_pubblico
          label_it: "Ente pubblico"
          activates_signals: [cross_sector_pa]
        - id: capitale_prevalente
          label_it: "Società con capitale interamente o prevalentemente pubblico (in-house, controllata, partecipata di maggioranza)"
          activates_signals: [cross_sector_inhouse_all_iv]
        - id: capitale_minoritario
          label_it: "Società con partecipazione pubblica minoritaria (sotto il 50%)"
          activates_signals: []

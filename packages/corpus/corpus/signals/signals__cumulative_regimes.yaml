# ============================================================================
# Signal di cumulo con REGIMI PARALLELI — definizioni condivise
# ============================================================================
#
# Un "signal di cumulo regime" segnala che il soggetto, oltre al regime NIS,
# rientra (o potrebbe rientrare) in un regime parallelo che si applica IN
# AGGIUNTA al NIS. NON altera il flusso del decision engine (quello lo fanno
# i regimes/), si limita ad aggiungere una voce nel verdetto.
#
# DEFINIZIONE vs TRIGGER:
# - qui vive la DEFINIZIONE (reasoning_trace, template, citazioni)
# - il TRIGGER (quando il signal si attiva) resta nei file di settore/wizard
#   (es. applies_to_categories, oppure activates_signals in una domanda)
#
# Il campo sector_context arricchisce il base_reasoning_trace quando il signal
# e' attivato da un settore specifico. Il decision engine concatena:
#   base_reasoning_trace + (sector_context[settore] se presente)
# ============================================================================

signals:
  - id: l90_cumulo
    kind: cumulative_regime
    target_regime: legge_90_2024
    message_template: l90_cumulo
    # C-E5 (corpus 0.6.0): formulazione "potrebbe rientrare, da verificare" (era "rientra
    # molto probabilmente"); non attivato nel settore energia.
    # Corpus 0.7.0: tolto "si cumula con il regime NIS senza sostituirlo". L'art. 1 c. 7
    # lett. a) L. 90/2024 esclude dall'art. 1 i soggetti li' richiamati (rinvio al D.Lgs.
    # 65/2018 riferito al D.Lgs. 138/2024 dall'art. 15-bis) e i soggetti PSNC; contesto PA
    # riscritto sull'art. 4 c. 8 Det. 127437/2026 ("puo' soddisfare", non "prassi attesa").
    base_reasoning_trace: "Il soggetto potrebbe rientrare anche nel perimetro della Legge 90/2024 (art. 1 c. 1, cybersicurezza nazionale): l'appartenenza va verificata. Il rapporto con il regime NIS va valutato caso per caso: le disposizioni dell'art. 1 della legge non si applicano ai soggetti richiamati dall'art. 1 c. 7 lett. a), tra cui i soggetti del Perimetro di Sicurezza Nazionale Cibernetica; il rinvio di quella lettera al D.Lgs. 65/2018 e' da intendersi alle corrispondenti disposizioni del D.Lgs. 138/2024 (art. 15-bis). Verifica con consulente qualificato."
    sector_context:
      pubblica_amministrazione: " Per i soggetti dell'art. 1 c. 1 L. 90/2024 che sono anche soggetti NIS, la designazione del Punto di contatto NIS puo' soddisfare l'obbligo di nomina e comunicazione del referente per la cybersicurezza (art. 8 c. 2 L. 90/2024; art. 4 c. 8 Det. piattaforma 127437/2026)."
      cloud_computing: " L'art. 1 c. 1 L. 90/2024 comprende le societa' in house dei soggetti elencati che forniscono servizi informatici."
    citations: [l90_2024_art_1_c_1, l90_2024_art_1_c_7_lett_a, l90_2024_art_15_bis, det_piattaforma_127437_2026_art_4_c_8]

# ----------------------------------------------------------------------------
# PLACEHOLDER per regimi paralleli non modellati nel MVP v0.1.0
# (presenti come signal informativi dove i settori li attivano via out_of_scope)
# ----------------------------------------------------------------------------

  # ID esplicito: salvaguardia DIMENSIONALE (deroga al consolidamento dimensionale
  # di gruppo), da non confondere con l'esclusione di sicurezza nazionale
  # NIS2 art. 2(7)-(8). Mai usare la sola parola "salvaguardia" in ID/label/copy.
  - id: safeguard_dimensional_dpcm_221
    kind: cumulative_regime
    target_regime: dpcm_221_2024
    status: placeholder_v0_2
    message_template: safeguard_dimensional_dpcm_221
    base_reasoning_trace: "Se il soggetto appartiene a un gruppo con imprese collegate o associate, potrebbe chiedere la salvaguardia dimensionale (DPCM 221/2024), che disapplica il consolidamento dimensionale di gruppo (art. 3 c. 4 D.Lgs. 138/2024) e, in casi di totale indipendenza dei sistemi e delle attivita', puo' farlo uscire dall'ambito NIS. La richiesta si presenta in fase di registrazione tramite la piattaforma ACN; l'ACN ne condivide gli elementi con le Autorita' di settore interessate (art. 12 c. 2 Det. ACN 127437/2026). Le Autorita' di settore procedono all'individuazione dei soggetti a cui si applica la deroga (art. 11 c. 4 lett. c) D.Lgs. 138/2024) e l'ACN la applica secondo i criteri del DPCM 221/2024, art. 3 c. 1 (art. 3 c. 12). Lo strumento puo' solo segnalare la possibilita'. Verifica con consulente qualificato."
    # art. 3 c. 4 = deroga sostanziale (proporzionalita' / indipendenza dalle imprese
    # collegate); art. 3 c. 12 = l'ACN applica la deroga di cui al c. 4 secondo i criteri
    # ex art. 40 c. 1 (base del DPCM 221/2024). Funzioni distinte, entrambe citate.
    # Corpus 0.7.0 (lint KB 2026-10-30, V8): la valutazione non e' della sola Autorita' di
    # settore: individuazione art. 11 c. 4 lett. c), applicazione ACN art. 3 c. 12,
    # condivisione in piattaforma art. 12 c. 2 Det. 127437/2026.
    citations: [dlgs_138_2024_art_3_c_4, dlgs_138_2024_art_3_c_12, dlgs_138_2024_art_11_c_4_lett_c, dpcm_221_2024_art_3_c_1, det_piattaforma_127437_2026_art_12_c_2]

  # ADR 0015 (corpus 0.6.0): attivato dalla risposta "si'" a soggetto_critico
  # (wizard__disambiguation.yaml). Supera il testo "regime parallelo e distinto dal
  # NIS2" (ADR 0004): l'individuazione come soggetto critico porta il soggetto in
  # ambito NIS come essenziale (art. 3 c. 5 lett. a), art. 6 c. 1 lett. b)).
  - id: cer_signal
    kind: cumulative_regime
    target_regime: dlgs_134_2024
    message_template: soggetti_critici_dlgs_134_2024
    base_reasoning_trace: "Il soggetto risulta individuato come soggetto critico ai sensi del D.Lgs. 134/2024, che recepisce la direttiva (UE) 2022/2557 sulla resilienza dei soggetti critici. Questa individuazione porta il soggetto nel perimetro NIS2 italiano come soggetto essenziale, indipendentemente dalla dimensione (art. 3 c. 5 lett. a) e art. 6 c. 1 lett. b) D.Lgs. 138/2024; FAQ ACN AMB.NO.1); la disciplina dei soggetti critici resta distinta e si aggiunge a quella NIS2. Da non confondere con le comunita' energetiche rinnovabili (CACER). Lo strumento non valuta gli obblighi della disciplina dei soggetti critici. Verifica con consulente qualificato."
    citations: [dlgs_134_2024, dlgs_138_2024_art_3_c_5_lett_a, dlgs_138_2024_art_6_c_1_lett_b, faq_amb_no_1]

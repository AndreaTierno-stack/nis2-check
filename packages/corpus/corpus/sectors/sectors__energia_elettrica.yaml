meta:
  sector_id: energia_elettrica
  label_it: "Energia elettrica"
  description_it: "Sottosettore energia elettrica (Allegato I, punto 1, lettera a), D.Lgs. 138/2024): trasmissione, distribuzione, fornitura, produzione e altre attività del sottosettore."
  allegato: I
  punto: 1
  sottosettore_id: A1_1_a
  critical_tier: altamente_critico
  size_cap_applicable: true
  size_blind: false
  pilot_mvp_v0_1_0: true
  citations:
    - dlgs_138_2024_allegato_I
    - faq_settori_sottosettori
    - dir_ue_2019_944           # base UE settore elettrico (Clean Energy Package)
  # A differenza di Cloud: nessun atto di esecuzione UE sulle misure tecniche
  cumulative_regulations:
    - det_acn_379907_2025       # specifiche di base ACN (unico atto cumulativo rilevante)
  technical_measures_source: det_acn_379907_2025_only
  incident_thresholds_source: det_acn_379907_2025   # NON Reg. UE 2024/2690 (non applicabile)
  notification_timeline: nis2_art_23_par_4
  # Nota esplicita: il Reg. UE 2024/2690 (DSP) non si applica al settore energia
  reg_ue_2024_2690_applicable: false

tipologie:
  - id: tso
    label_it: "Gestore del sistema di trasmissione (TSO)"
    faq_code: A1_1_a_1
    citations: [faq_a1_1_a_1, dir_ue_2019_944]
    verdict_strategy: categorical_assessment
    categorization_model: model_1
    typical_psnc_overlap: very_high      # stima descrittiva, non attestata nella KB (C-E6, 0.6.0)
    typical_l90_overlap: conditional

  - id: dso
    label_it: "Gestore del sistema di distribuzione (DSO)"
    faq_code: A1_1_a_1
    citations: [faq_a1_1_a_1, dir_ue_2019_944]
    verdict_strategy: categorical_assessment
    categorization_model: model_1
    typical_psnc_overlap: high           # grandi DSO si', medi da verificare
    typical_l90_overlap: conditional

  - id: impresa_fornitura
    # C-E1 (0.6.0): "fornitura" = "la vendita, compresa la rivendita, di energia
    # elettrica ai clienti" (FAQ A1.1.a.2, art. 2 p. 12 dir. 2019/944), non solo ai clienti finali
    label_it: "Impresa elettrica di fornitura (vendita, compresa la rivendita, di energia elettrica ai clienti)"
    faq_code: A1_1_a_1, A1_1_a_2
    citations: [faq_a1_1_a_1, faq_a1_1_a_2]
    verdict_strategy: categorical_assessment
    categorization_model: model_1
    typical_psnc_overlap: medium
    typical_l90_overlap: conditional

  - id: produttore
    label_it: "Produttore di energia elettrica"
    faq_code: A1_1_a_1, A1_1_a_4
    citations: [faq_a1_1_a_1, faq_a1_1_a_4]
    verdict_strategy: categorical_assessment
    categorization_model: model_1
    typical_psnc_overlap: medium         # possibile per impianti critici
    typical_l90_overlap: conditional
    # C-E2 (0.6.0): esclusione resa con la domanda produttore_cliente_attivo del wizard
    scoping_note_it: "Secondo la FAQ A1.1.a.4 non rientrano le organizzazioni che rispondono ai requisiti della definizione di clienti attivi e non svolgono altre attività riconducibili agli Allegati I e II."

  - id: gestore_mercato
    label_it: "Gestore del mercato elettrico designato"
    faq_code: A1_1_a_1
    citations: [faq_a1_1_a_1]
    verdict_strategy: categorical_assessment
    categorization_model: model_1
    typical_psnc_overlap: very_high
    typical_l90_overlap: conditional

  - id: partecipante_aggregazione
    label_it: "Partecipante al mercato elettrico (aggregazione, gestione domanda, stoccaggio)"
    faq_code: A1_1_a_1
    citations: [faq_a1_1_a_1]
    verdict_strategy: categorical_assessment
    categorization_model: model_1
    typical_psnc_overlap: low
    typical_l90_overlap: conditional

  - id: gestore_punti_ricarica
    label_it: "Gestore di punti di ricarica"
    faq_code: A1_1_a_3
    citations: [faq_a1_1_a_3]
    verdict_strategy: categorical_assessment
    categorization_model: model_1
    typical_psnc_overlap: none
    typical_l90_overlap: conditional
    scoping_note_it: "Rientra solo se registrato su PUN (DM MASE 106/2023). I meri punti vendita con ricarica non registrati su PUN non rientrano automaticamente (A1.1.a.3)."

qualification_rules:
  # ADR 0015: soggetto critico (D.Lgs. 134/2024) -> essenziale a prescindere dalla
  # dimensione; le regole dimensionali valgono solo con soggetto_critico == no.
  - condition: soggetto_critico == yes
    stage: size_blind
    outcome: categorical_assessment
    qualifica: essenziale
    verdict_outcome: likely_in_scope   # vincolo fisso: categorical_assessment in-scope -> likely_in_scope
    reasoning_trace: "Il soggetto risulta individuato come soggetto critico ai sensi del D.Lgs. 134/2024. Sulla base degli input forniti, l'analisi suggerisce il rientro nel perimetro NIS2 italiano come soggetto essenziale, indipendentemente dalla dimensione (art. 3 c. 5 lett. a) e art. 6 c. 1 lett. b) D.Lgs. 138/2024; FAQ ACN AMB.NO.1). Verifica obbligatoria con consulente qualificato."
    citations: [dlgs_138_2024_art_3_c_5_lett_a, dlgs_138_2024_art_6_c_1_lett_b, faq_amb_no_1]
    notices: [energia_regime_transitorio_ose]
  - condition: dimension == micro_or_piccola AND soggetto_critico == no
    stage: dimensional
    outcome: out_of_scope
    verdict_outcome: likely_out_of_scope   # vincolo fisso: out_of_scope -> likely_out_of_scope
    reasoning_trace: "Dimensione dichiarata: Micro o piccola impresa. Classificazione secondo FAQ ACN AMB.DI.1 e Racc. UE 2003/361. Esclusione dall'ambito NIS2 in via generale (art. 3 c. 2 D.Lgs. 138/2024)."
    citations: [dlgs_138_2024_art_3_c_2, racc_ue_2003_361, faq_amb_di_1]
    notices: [individuazione_acn_art_3_c_9, imprese_collegate_art_3_c_10]
  - condition: dimension == media AND soggetto_critico == no
    stage: dimensional
    outcome: categorical_assessment
    qualifica: importante
    verdict_outcome: likely_in_scope   # vincolo fisso: categorical_assessment in-scope -> likely_in_scope
    reasoning_trace: "Dimensione dichiarata: Media impresa. Classificazione secondo FAQ ACN AMB.DI.1 e Racc. UE 2003/361. In settore Allegato I p. 1 (Energia) qualificato come soggetto importante. Per 'fatturato' si intende quello complessivo del soggetto, non solo dell'attività NIS (FAQ A1.2). Per i produttori, non rientrano i clienti attivi che non svolgono altre attività degli Allegati I e II (FAQ A1.1.a.4)."
    citations: [dlgs_138_2024_art_6, faq_amb_di_1, racc_ue_2003_361, faq_a1_2, faq_a1_1_a_4]
    notices: [energia_regime_transitorio_ose]
  - condition: dimension == grande AND soggetto_critico == no
    stage: dimensional
    outcome: categorical_assessment
    qualifica: essenziale
    verdict_outcome: likely_in_scope   # vincolo fisso: categorical_assessment in-scope -> likely_in_scope
    reasoning_trace: "Dimensione dichiarata: Grande impresa. Classificazione secondo FAQ ACN AMB.DI.1 e Racc. UE 2003/361. In settore Allegato I (altamente critico) qualificato come soggetto essenziale. Per i produttori, non rientrano i clienti attivi che non svolgono altre attività degli Allegati I e II (FAQ A1.1.a.4)."
    citations: [dlgs_138_2024_art_6, faq_amb_di_1, racc_ue_2003_361, faq_a1_1_a_4]
    notices: [energia_regime_transitorio_ose]

overrides:
  - trigger: psnc == yes
    override_kind: category_override
    reference: regimes/psnc.yaml
    # C-E6 (0.6.0): rimossa la frase "TSO e grandi DSO sono tipicamente in perimetro PSNC" (non attestata)
    reasoning_trace: "Servizi PSNC del soggetto categorizzati come 'alto' d'ufficio, fuori dal procedimento ordinario, ai sensi dell'art. 5 Det. ACN 155238/2026. I servizi NIS non PSNC mantengono procedimento ordinario."
    citations: [det_acn_155238_2026_art_5, dl_105_2019_art_1_c_2_bis]
  # ADR 0014: nessun override DORA. L'art. 3 c. 14 D.Lgs. 138/2024 riguarda solo i
  # settori 3 e 4 dell'Allegato I; la domanda comune dora resta come segnale (notice
  # di catalogo), l'esito segue le regole del settore.
  # Cloud PA: non pertinente al settore energia -> nessun override.

# Identita' multiple intra-settore (trigger; definizione in signals/signals__cross_sector.yaml)
multi_identity_intra_sector:
  - signal: cross_sector_multi_tipologia_elettrica
    condition_source: wizard_question
    condition_ref: attivita_elettriche_ulteriori
    trigger: any_selected

# Regime transitorio OSE (corpus 0.6.0): fino a 0.5.0 era un caso out_of_scope_mvp
# (handling cross_sector_signal, verdict_outcome ambiguous) senza trigger ne' signal:
# non scattava mai. L'art. 5 Det. 379907/2025 riguarda le misure tecniche e
# organizzative degli ex OSE, non l'ambito: l'esito resta quello delle regole, con
# l'avviso di catalogo energia_regime_transitorio_ose sulle regole in ambito.

# ============================================================================
# Vincoli di copy (rendering verdetto/signal) — collisione acronimo "CER"
# ============================================================================
copy_constraints:
  - id: cer_cacer_disambiguation
    rule_it: "Mai usare l'acronimo nudo 'CER' nel copy del verdetto o dei signal. La disciplina D.Lgs. 134/2024 va resa come 'soggetti critici (D.Lgs. 134/2024)' oppure 'Critical Entities Resilience'; le comunità energetiche vanno rese come 'comunità energetiche rinnovabili (CACER)'. Nel settore energia 'CER' è ambiguo tra i due istituti."
    # ADR 0015: il caso out_of_scope_mvp.cer_dlgs_134_2024 e' rimosso (soggetti critici
    # trattati dalla domanda comune soggetto_critico e dalla prima qualification_rule).
    applies_to: [cer_signal, "wizard/wizard__disambiguation.yaml#soggetto_critico"]

# ============================================================================
# Settore: Pubblica Amministrazione — MODELLO DATI
# Allegato III — PA che rientrano a prescindere dalla dimensione
# Allegato IV — individuazione governativa (canale alternativo)
# Le domande del wizard vivono in wizard/wizard__pubblica_amministrazione.yaml
# ============================================================================
#
# NOTE DI SCHEMA (decisioni di modellazione applicate in questo file):
# - size_blind: true e' DOCUMENTALE/VALIDAZIONE, non pilota branch. Il decision
#   engine usa sempre e solo le condition delle qualification_rules. Il flag
#   serve al validatore: se size_blind, nessuna qualification_rule deve avere
#   condizioni sulla dimensione.
# - verdict_strategy NON e' una proprieta' delle categorie: e' l'outcome della
#   qualification_rule che matcha la categoria. Le categorie qui sono descrittive.
# - qualifica vs qualifica_inferita: 'qualifica' quando il tool la EMETTE
#   (outcome categorical_assessment); 'qualifica_inferita' quando la SEGNALA
#   soltanto (outcome qualitative_signal_only). Mai entrambe sulla stessa voce.
#   Da corpus 0.5.0 (ADR 0011) tutte le lettere a)-d) emettono la qualifica.
# - Filtro ISTAT (Lista S13): strada 2 — non chiesto al wizard, assunto e
#   dichiarato nel reasoning_trace come prerequisito da verificare.
# ============================================================================

meta:
  sector_id: pubblica_amministrazione
  label_it: "Pubblica amministrazione"
  description_it: "Pubbliche amministrazioni dell'Allegato III del D.Lgs. 138/2024 e soggetti pubblici o a partecipazione pubblica fuori dall'Allegato III."
  allegato: III                  # piu' canale Allegato IV (vedi sezione dedicata)
  critical_tier: non_applicabile # le PA non sono "altamente critico/critico": rientro autonomo
  size_cap_applicable: false
  size_blind: true               # DOCUMENTALE — vedi note di schema
  pilot_mvp_v0_1_0: true
  citations:
    - dlgs_138_2024_allegato_III
    - dlgs_138_2024_art_3_c_6    # rientro a prescindere dalla dimensione
    - faq_settori_sottosettori   # codici A3.*
    - l_196_2009_art_1_c_3       # elenco ISTAT (Lista S13) — prerequisito di rientro
  # Modello di categorizzazione: All. III -> modello 2 (art. 2 c. 3 Det. 155238/2026)
  # (Logistica = minimo). All. IV tipo 1 (TPL) -> modello 1.
  categorization_model: model_2
  technical_measures_source: det_acn_379907_2025
  notification_timeline: nis2_art_23_par_4
  # Regime sanzionatorio speciale PA (art. 38 c. 9): 25.000 - 125.000 EUR
  # (rilevante per il PDF parte 2, non per il calcolo del rientro)
  special_sanction_regime: pa_25k_125k

# Prerequisito di rientro dichiarato (strada 2 ISTAT):
# non e' una domanda al wizard, e' un'assunzione che entra nei reasoning_trace.
rientro_prerequisite:
  id: istat_s13
  assumption_it: "La valutazione presuppone l'inclusione del soggetto nell'elenco ISTAT delle amministrazioni pubbliche (c.d. Lista S13, ex art. 1 c. 3 L. 196/2009). Questo prerequisito non è verificato dallo strumento e va confermato con il consulente."
  citations: [l_196_2009_art_1_c_3]

# ============================================================================
# Categorie dell'Allegato III (descrittive — la strategia sta nelle regole)
# ============================================================================

categorie:
  - id: a
    label_it: "Amministrazioni centrali"
    descrizione_it: "Allegato III lett. a): Organi costituzionali e di rilievo costituzionale; Presidenza del Consiglio dei ministri e Ministeri; Agenzie fiscali; Autorità amministrative indipendenti. L'art. 4 c. 2 non vi ricomprende Parlamento italiano, Autorità giudiziaria, Banca d'Italia e Unità di informazione finanziaria per l'Italia."
    faq_code: A3_a
    citations: [dlgs_138_2024_allegato_III, dlgs_138_2024_art_4_c_2, faq_settori_sottosettori]

  - id: b
    label_it: "Amministrazioni regionali"
    descrizione_it: "Allegato III lett. b): Regioni e Province autonome (registrazione separata dell'organo, A3.b.1.1)."
    faq_code: A3_b
    citations: [dlgs_138_2024_allegato_III, faq_settori_sottosettori]

  - id: c
    label_it: "Amministrazioni locali"
    descrizione_it: "Allegato III lett. c): quattro sottotipi con trattamento non uniforme (l'ASL ha doppia identità)."
    faq_code: A3_c
    citations: [dlgs_138_2024_allegato_III, faq_settori_sottosettori]
    sottotipi:
      - id: citta_metropolitana
        label_it: "Citta metropolitana"
        faq_code: A3_c_1
      - id: comune_oltre_100k
        label_it: "Comune con popolazione superiore a 100.000 abitanti"
        faq_code: A3_c_2
      - id: comune_capoluogo
        label_it: "Comune capoluogo di Regione"
        faq_code: A3_c_3
      - id: asl
        label_it: "Azienda Sanitaria Locale (ASL)"
        faq_code: A3_c_4_1
        # Doppia identita': All. III (PA, importante) + All. I p. 5 (Sanitario, essenziale)
        special_handling: doppia_identita_sanitario

  - id: d
    label_it: "Altri soggetti pubblici"
    descrizione_it: "Allegato III lett. d): sei sottotipi (vedi wizard, domanda sottotipo_d)."
    faq_code: A3_d
    citations: [dlgs_138_2024_allegato_III, faq_settori_sottosettori]
    sottotipi:
      - id: enti_regolazione_attivita_economica
        label_it: "Enti di regolazione dell'attività economica"
      - id: enti_produttori_servizi_economici
        label_it: "Enti produttori di servizi economici"
      - id: enti_struttura_associativa
        label_it: "Enti a struttura associativa"
      - id: enti_servizi_assistenziali_ricreativi_culturali
        label_it: "Enti produttori di servizi assistenziali, ricreativi e culturali"
      - id: enti_istituzioni_ricerca
        label_it: "Enti e Istituzioni di ricerca"
      - id: istituti_zooprofilattici_sperimentali
        label_it: "Istituti zooprofilattici sperimentali"
    # NOTA: il cumulo con la L. 90/2024 per la lett. d) non e' attestato: il signal
    # l90_cumulo non si attiva (trigger solo su categoria_pa a, b, c); avviso dal catalogo
    # eccezioni (pa_lett_d_cumulo_l90_non_attestato, STATUS 14).

# ============================================================================
# Regole di qualificazione (size-blind: condizione sulla CATEGORIA)
# La strategia di verdetto (outcome) vive QUI, non nelle categorie.
# ADR 0011: la PA dell'Allegato III lett. a)-d) rientra per legge, indipendentemente
# dalla dimensione (art. 3 c. 6): tutte e quattro le lettere hanno un verdetto
# categoriale. Supera la "strada 3" (ADR 0002, nota sul qualitative_signal_only PA).
# Gli avvisi (notices) puntano al catalogo eccezioni (ADR 0012).
# ============================================================================

qualification_rules:
  # Categoria a) — essenziale per art. 6 c. 1 lett. e)
  - condition: categoria_pa == a
    stage: size_blind
    outcome: categorical_assessment
    verdict_outcome: likely_in_scope   # vincolo fisso: categorical_assessment in-scope -> likely_in_scope
    qualifica: essenziale
    reasoning_trace: "Per le amministrazioni centrali dell'Allegato III lett. a) (organi costituzionali e di rilievo costituzionale, Presidenza del Consiglio dei ministri e Ministeri, Agenzie fiscali, Autorità amministrative indipendenti), l'analisi suggerisce il rientro nel perimetro NIS2 italiano come soggetto essenziale, indipendentemente dalla dimensione (art. 3 c. 6 e art. 6 c. 1 lett. e) D.Lgs. 138/2024). L'elenco dei soggetti essenziali e importanti è stabilito con determinazione dell'ACN (art. 40 c. 5 lett. a)). La valutazione presuppone l'inclusione nell'elenco ISTAT (Lista S13). Verifica obbligatoria con consulente qualificato."
    citations: [dlgs_138_2024_allegato_III, dlgs_138_2024_art_3_c_6, dlgs_138_2024_art_6_c_1_lett_e, dlgs_138_2024_art_40_c_5_lett_a, l_196_2009_art_1_c_3]
    notices: [pa_organi_costituzionali_capo_v_art_4_c_2, pa_esclusioni_sicurezza_nazionale_art_4_c_3, pa_prerequisito_istat_s13]

  # Soggetti che l'art. 4 c. 2 non ricomprende tra le PA dell'art. 3 cc. 6-7: dal corpus 0.13.0
  # l'esclusione e' una mappatura di stadio 2 su categoria_pa (wizard PA, ADR 0016). Se il soggetto
  # e' anche individuato come soggetto critico, l'art. 3 c. 5 lett. a) e' un canale autonomo
  # (l'art. 4 c. 2 esclude solo dai cc. 6-7): questa regola di stadio 3 include, e la coppia con
  # l'esclusione di stadio 2 decide dal blocco conflicts (review 2026-11-02, F03).
  - condition: categoria_pa == esclusa_art_4_c_2 AND soggetto_critico == yes
    stage: size_blind
    outcome: categorical_assessment
    verdict_outcome: likely_in_scope   # vincolo fisso: categorical_assessment in-scope -> likely_in_scope
    qualifica: essenziale
    reasoning_trace: "Il soggetto risulta individuato come soggetto critico ai sensi del D.Lgs. 134/2024. Sulla base degli input forniti, l'analisi suggerisce il rientro nel perimetro NIS2 italiano come soggetto essenziale, indipendentemente dalla dimensione (art. 3 c. 5 lett. a) e art. 6 c. 1 lett. b) D.Lgs. 138/2024; FAQ ACN AMB.NO.1). Verifica obbligatoria con consulente qualificato."
    citations: [dlgs_138_2024_art_3_c_5_lett_a, dlgs_138_2024_art_6_c_1_lett_b, faq_amb_no_1]

  # Categoria b) — importante per art. 6 c. 3, elevabile ex art. 6 c. 2
  - condition: categoria_pa == b AND soggetto_critico == no
    stage: size_blind
    outcome: categorical_assessment
    verdict_outcome: likely_in_scope   # vincolo fisso: categorical_assessment in-scope -> likely_in_scope
    qualifica: importante
    reasoning_trace: "Per le Regioni e Province autonome (Allegato III lett. b), l'analisi suggerisce il rientro nel perimetro NIS2 italiano come soggetto importante, indipendentemente dalla dimensione (art. 3 c. 6 e art. 6 c. 3 D.Lgs. 138/2024); la qualifica può essere elevata a essenziale con individuazione dell'ACN (art. 6 c. 2). La valutazione presuppone l'inclusione nell'elenco ISTAT (Lista S13). Verifica obbligatoria con consulente qualificato."
    citations: [dlgs_138_2024_allegato_III, dlgs_138_2024_art_3_c_6, dlgs_138_2024_art_6_c_3, dlgs_138_2024_art_6_c_2, l_196_2009_art_1_c_3]
    notices: [pa_qualifica_elevabile_art_6_c_2, pa_esclusioni_sicurezza_nazionale_art_4_c_3, pa_prerequisito_istat_s13]

  # Categoria c) — importante per art. 6 c. 3, elevabile ex art. 6 c. 2
  - condition: categoria_pa == c AND soggetto_critico == no
    stage: size_blind
    outcome: categorical_assessment
    verdict_outcome: likely_in_scope   # vincolo fisso: categorical_assessment in-scope -> likely_in_scope
    qualifica: importante
    reasoning_trace: "Per le amministrazioni locali (Allegato III lett. c), l'analisi suggerisce il rientro nel perimetro NIS2 italiano come soggetto importante, indipendentemente dalla dimensione (art. 3 c. 6 e art. 6 c. 3 D.Lgs. 138/2024); la qualifica può essere elevata a essenziale con individuazione dell'ACN (art. 6 c. 2). La valutazione presuppone l'inclusione nell'elenco ISTAT (Lista S13). Verifica obbligatoria con consulente qualificato prima di assumere conclusioni operative."
    citations: [dlgs_138_2024_allegato_III, dlgs_138_2024_art_3_c_6, dlgs_138_2024_art_6_c_3, dlgs_138_2024_art_6_c_2, faq_settori_sottosettori]
    notices: [pa_qualifica_elevabile_art_6_c_2, pa_esclusioni_sicurezza_nazionale_art_4_c_3, pa_prerequisito_istat_s13]

  # Categoria d) — importante per art. 6 c. 3, elevabile ex art. 6 c. 2
  - condition: categoria_pa == d AND soggetto_critico == no
    stage: size_blind
    outcome: categorical_assessment
    verdict_outcome: likely_in_scope   # vincolo fisso: categorical_assessment in-scope -> likely_in_scope
    qualifica: importante
    reasoning_trace: "Per gli altri soggetti pubblici dell'Allegato III lett. d) (enti di regolazione dell'attività economica, enti produttori di servizi economici, enti a struttura associativa, enti produttori di servizi assistenziali, ricreativi e culturali, enti e istituzioni di ricerca, istituti zooprofilattici sperimentali), l'analisi suggerisce il rientro nel perimetro NIS2 italiano come soggetto importante, indipendentemente dalla dimensione (art. 3 c. 6 e art. 6 c. 3 D.Lgs. 138/2024); la qualifica può essere elevata a essenziale con individuazione dell'ACN (art. 6 c. 2). La valutazione presuppone l'inclusione nell'elenco ISTAT (Lista S13). Verifica obbligatoria con consulente qualificato."
    citations: [dlgs_138_2024_allegato_III, dlgs_138_2024_art_3_c_6, dlgs_138_2024_art_6_c_3, dlgs_138_2024_art_6_c_2, l_196_2009_art_1_c_3]
    notices: [pa_qualifica_elevabile_art_6_c_2, pa_esclusioni_sicurezza_nazionale_art_4_c_3, pa_lett_d_cumulo_l90_non_attestato, pa_prerequisito_istat_s13]

  # ADR 0015: soggetto critico (D.Lgs. 134/2024) -> essenziale per art. 6 c. 1 lett. b),
  # che prevale sull'importante delle lett. b)-d) (art. 6 c. 3 riguarda i soggetti non
  # essenziali ai sensi dei cc. 1-2). La lett. a) e' gia' essenziale (art. 6 c. 1 lett. e)).
  - condition: categoria_pa == b AND soggetto_critico == yes
    stage: size_blind
    outcome: categorical_assessment
    verdict_outcome: likely_in_scope   # vincolo fisso: categorical_assessment in-scope -> likely_in_scope
    qualifica: essenziale
    reasoning_trace: "Per le Regioni e Province autonome (Allegato III lett. b) individuate come soggetto critico ai sensi del D.Lgs. 134/2024, l'analisi suggerisce il rientro nel perimetro NIS2 italiano come soggetto essenziale, indipendentemente dalla dimensione (art. 3 cc. 5 lett. a) e 6, art. 6 c. 1 lett. b) D.Lgs. 138/2024; FAQ ACN AMB.NO.1). La valutazione presuppone l'inclusione nell'elenco ISTAT (Lista S13). Verifica obbligatoria con consulente qualificato."
    citations: [dlgs_138_2024_allegato_III, dlgs_138_2024_art_3_c_6, dlgs_138_2024_art_3_c_5_lett_a, dlgs_138_2024_art_6_c_1_lett_b, faq_amb_no_1, l_196_2009_art_1_c_3]
    notices: [pa_esclusioni_sicurezza_nazionale_art_4_c_3, pa_prerequisito_istat_s13]

  - condition: categoria_pa == c AND soggetto_critico == yes
    stage: size_blind
    outcome: categorical_assessment
    verdict_outcome: likely_in_scope   # vincolo fisso: categorical_assessment in-scope -> likely_in_scope
    qualifica: essenziale
    reasoning_trace: "Per le amministrazioni locali (Allegato III lett. c) individuate come soggetto critico ai sensi del D.Lgs. 134/2024, l'analisi suggerisce il rientro nel perimetro NIS2 italiano come soggetto essenziale, indipendentemente dalla dimensione (art. 3 cc. 5 lett. a) e 6, art. 6 c. 1 lett. b) D.Lgs. 138/2024; FAQ ACN AMB.NO.1). La valutazione presuppone l'inclusione nell'elenco ISTAT (Lista S13). Verifica obbligatoria con consulente qualificato."
    citations: [dlgs_138_2024_allegato_III, dlgs_138_2024_art_3_c_6, dlgs_138_2024_art_3_c_5_lett_a, dlgs_138_2024_art_6_c_1_lett_b, faq_amb_no_1, l_196_2009_art_1_c_3]
    notices: [pa_esclusioni_sicurezza_nazionale_art_4_c_3, pa_prerequisito_istat_s13]

  - condition: categoria_pa == d AND soggetto_critico == yes
    stage: size_blind
    outcome: categorical_assessment
    verdict_outcome: likely_in_scope   # vincolo fisso: categorical_assessment in-scope -> likely_in_scope
    qualifica: essenziale
    reasoning_trace: "Per gli altri soggetti pubblici dell'Allegato III lett. d) individuati come soggetto critico ai sensi del D.Lgs. 134/2024, l'analisi suggerisce il rientro nel perimetro NIS2 italiano come soggetto essenziale, indipendentemente dalla dimensione (art. 3 cc. 5 lett. a) e 6, art. 6 c. 1 lett. b) D.Lgs. 138/2024; FAQ ACN AMB.NO.1). La valutazione presuppone l'inclusione nell'elenco ISTAT (Lista S13). Verifica obbligatoria con consulente qualificato."
    citations: [dlgs_138_2024_allegato_III, dlgs_138_2024_art_3_c_6, dlgs_138_2024_art_3_c_5_lett_a, dlgs_138_2024_art_6_c_1_lett_b, faq_amb_no_1, l_196_2009_art_1_c_3]
    notices: [pa_esclusioni_sicurezza_nazionale_art_4_c_3, pa_lett_d_cumulo_l90_non_attestato, pa_prerequisito_istat_s13]

  # Corpus 0.9.0: il canale Allegato IV e' deciso da questa regola (E_OUTCOME_WITHOUT_TRIGGER).
  # Esito, trace, citazioni e avvisi vengono dal blocco allegato_iv_channel tramite
  # reference (pattern ADR 0009): il blocco e' un dato, non un trigger. Con
  # soggetto_critico == yes resta ambiguous (ADR 0015, non modellato).
  - condition: categoria_pa == canale_allegato_iv
    stage: size_blind
    reference: allegato_iv_channel

# ============================================================================
# Override di regime (ADR 0014): Cloud PA (trigger classificazione_cloud_pa, domanda
# del wizard PA) e PSNC (trigger psnc, domanda del blocco comune). Nessun override
# DORA (art. 3 c. 14 riservato ai settori 3-4). L'ordine degli override e' l'ordine
# di Verdict.regimeRouting: posizionale, non una precedenza (ADR 0009, amendment).
# ============================================================================

overrides:
  # C5 (corpus 0.5.0): la domanda comune cloud_pa e' per i fornitori; per la PA il
  # trigger e' la condizione stessa dell'override (PA che ha classificato dati e servizi).
  - trigger: classificazione_cloud_pa == yes
    override_kind: model_substitution
    reference: regimes/cloud_pa.yaml
    reasoning_trace: "Per una Pubblica Amministrazione, la classificazione dei dati e dei servizi ai sensi del Regolamento Cloud (Decreto Direttoriale ACN n. 21007/24 del 27 giugno 2024, art. 3) comporta l'applicazione del modello Cloud PA (ordinari/critici/strategici) in luogo del modello di categorizzazione NIS, ai sensi dell'art. 4 Det. ACN 155238/2026. L'elenco delle attività e dei servizi coincide con quello dei dati e servizi digitali classificati ai sensi del Regolamento Cloud. La classificazione riguarda la categorizzazione delle attività e dei servizi e non restringe l'ambito: per le pubbliche amministrazioni dell'Allegato III il rientro nel perimetro NIS2 è indipendente dalla dimensione (art. 3 c. 6 D.Lgs. 138/2024). Lo strumento non formula un esito sull'applicazione del modello Cloud PA in luogo del modello NIS: il caso va valutato con un consulente qualificato."
    citations: [dd_acn_21007_24_art_3, det_acn_155238_2026_art_4, dlgs_138_2024_art_3_c_6]
  # ADR 0014 (corpus 0.6.0): PSNC per la PA, sul regime esistente
  - trigger: psnc == yes
    override_kind: category_override
    reference: regimes/psnc.yaml
    reasoning_trace: "Ai servizi PSNC dell'amministrazione è attribuita d'ufficio la categoria di rilevanza 'impatto alto', fuori dal procedimento ordinario di categorizzazione (art. 5 Det. ACN 155238/2026); i servizi NIS non PSNC mantengono il procedimento ordinario. L'inserimento nel PSNC non restringe l'ambito NIS: per le pubbliche amministrazioni dell'Allegato III il rientro nel perimetro è indipendente dalla dimensione (art. 3 c. 6 D.Lgs. 138/2024). Lo strumento non formula un esito sul rapporto tra gli obblighi NIS e quelli del PSNC, regolato dall'art. 33 D.Lgs. 138/2024: il caso va valutato con un consulente qualificato."
    # citations coincidenti con regimes/psnc.yaml (invariante override/regime, ADR 0009)
    citations: [det_acn_155238_2026_art_5, dl_105_2019_art_1_c_2_bis, dlgs_138_2024_art_33]

# Signal di cumulo regimi (trigger; definizione in signals/signals__cumulative_regimes.yaml)
# Corpus 0.9.0: trigger espliciti su categoria_pa al posto di applies_to_categories
# [a, b, c] (binding implicito). La grammatica delle condizioni non ha OR: un trigger
# per categoria.
cumulative_signals:
  - signal: l90_cumulo
    trigger: categoria_pa == a
  - signal: l90_cumulo
    trigger: categoria_pa == b
  - signal: l90_cumulo
    trigger: categoria_pa == c

# Cross-sector signal (trigger; definizione in signals/signals__cross_sector.yaml)
cross_sector_signals:
  - signal: cross_sector_asl_sanitario
    trigger: sottotipo_c == asl

# Canale Allegato IV — individuazione governativa (NON determinabile dal tool)
# Definizione del signal in signals/signals__cross_sector.yaml (allegato_iv_individuazione).
# Blocco di dati (corpus 0.9.0): non scatta da solo, lo applica la regola
# categoria_pa == canale_allegato_iv tramite reference.
allegato_iv_channel:
  signal: allegato_iv_individuazione
  verdict_strategy: qualitative_signal_only
  verdict_outcome: ambiguous   # canale All. IV (incl. in-house): dipende da atto dell'autorita', non determinabile in self-assessment
  reasoning_trace: "Il soggetto si indica come soggetto pubblico o a partecipazione pubblica fuori dalle categorie dell'Allegato III. Potrebbe rientrare nel perimetro NIS2 italiano tramite l'Allegato IV, indipendentemente dalla dimensione, solo se individuato dall'ACN su proposta delle Autorità di settore, con notifica al soggetto (art. 3 cc. 8 e 13 D.Lgs. 138/2024; FAQ ACN A4.1). Lo strumento non può determinare questa individuazione. Verifica obbligatoria con consulente qualificato."
  citations: [dlgs_138_2024_art_3_c_8, dlgs_138_2024_art_3_c_13, faq_a4_1]
  # soggetti pubblici fuori dalle categorie dell'Allegato III: possibili categorie aggiunte con DPCM
  notices: [pa_categorie_aggiunte_dpcm_art_3_c_7, allegato_iv_individuazione_art_3_c_8]
  profili:
    # Corpus 0.8.0: l'art. 1 c. 1 L. 90/2024 comprende solo le societa' di trasporto
    # pubblico urbano con bacino di utenza non inferiore a 100.000 abitanti e quelle di
    # trasporto pubblico extraurbano operanti nell'ambito delle citta' metropolitane.
    - id: tpl_soggetto_l90
      label_it: "Trasporto pubblico locale indicato dall'art. 1 c. 1 L. 90/2024"
      autorita_proponente: MIT
      categorization_model: model_1   # All. IV tipo 1 -> modello 1
      l90_overlap: "yes"                  # art. 1 c. 1 L. 90
    - id: tpl
      label_it: "Altro trasporto pubblico locale"
      autorita_proponente: MIT
      categorization_model: model_1   # All. IV tipo 1 -> modello 1
      l90_overlap: "no"                   # fuori dall'art. 1 c. 1 L. 90 (corpus 0.8.0)
    - id: istituto_ricerca
      label_it: "Istituto di istruzione che svolge ricerca"
      autorita_proponente: MUR
      l90_overlap: possible
    - id: attivita_culturale
      label_it: "Soggetto che svolge attività di interesse culturale"
      autorita_proponente: MiC
      l90_overlap: possible
    # Corpus 0.7.0: l'art. 1 c. 1 L. 90/2024 comprende le societa' in house dei soggetti
    # elencati solo se forniscono servizi informatici, di trasporto, di acque reflue o di
    # gestione dei rifiuti: profilo distinto (stesso ID dell'opzione cloud).
    - id: inhouse_soggetto_l90
      label_it: "Società in house di un soggetto dell'art. 1 c. 1 L. 90/2024, con servizi qualificati"
      autorita_proponente: autorita_di_settore
      l90_overlap: "yes"                  # in house qualificata: art. 1 c. 1 L. 90
      unifies_with: cross_sector_inhouse_all_iv
    - id: societa_inhouse
      label_it: "Altra società in-house, partecipata, controllata (D.Lgs. 175/2016)"
      autorita_proponente: autorita_di_settore
      l90_overlap: "no"                   # fuori dall'art. 1 c. 1 L. 90 (corpus 0.7.0)
      # Per gli in-house questo signal coincide con cross_sector_inhouse_all_iv
      # gia' attivato dalla pertinenza pubblica negli altri settori.
      unifies_with: cross_sector_inhouse_all_iv


scenario_id: E08
name: multi_regime_escalate
description_it: >
  Intersezione multipla psnc==yes AND cloud_pa==yes. L'ordine di precedenza tra
  l'automatismo "alto" PSNC (art. 5) e la sostituzione di modello Cloud PA (art. 4)
  non e' esplicitato nelle fonti. Il decision engine emette escalate_to_advisor
  invece di tentare di risolvere. Vincolo fisso: escalate_to_advisor -> ambiguous.
corpus_version: 0.5.0
sector: cloud_computing

inputs:
  psnc: "yes"
  dora: "no"
  cloud_pa: "yes"
  pertinenza_pubblica_cloud: "no"
  fornisce_servizi_gestiti_b2b: "no"
  dimension: grande

expected:
  assessment_mode: escalate_to_advisor
  verdict_outcome: ambiguous
  signals: []
  # ADR 0009 amendment: entrambi i regimi, nell'ordine degli override di
  # sectors__cloud_computing.yaml (cloud_pa prima di psnc). Ordine posizionale,
  # non precedenza: l'esito resta quello di multi_regime_intersection.
  regime_routing:
    - regime: cloud_pa
      routing_effect: model_substitution
      residual_nis_obligation: null   # null = non attestato nel corpus, non "nessuno"
      exceptions_catalog_entry: cloud_pa_model_substitution
    - regime: psnc
      routing_effect: category_override
      residual_nis_obligation: null   # null = non attestato nel corpus, non "nessuno"
      exceptions_catalog_entry: psnc_category_override
  corpus_ref: "wizard/wizard__disambiguation.yaml#multi_regime_intersection[psnc==yes AND cloud_pa==yes] + sectors/sectors__cloud_computing.yaml#overrides[cloud_pa==yes, psnc==yes] -> regimes/cloud_pa.yaml, regimes/psnc.yaml"

citations: [det_acn_155238_2026_art_4, det_acn_155238_2026_art_5]

scenario_id: E06
name: dora_entita_finanziaria_cloud
description_it: >
  Fornitore cloud di grande dimensione che dichiara di essere un'entita' finanziaria
  regolata da DORA (Reg. UE 2022/2554). ADR 0014: l'art. 3 c. 14 D.Lgs. 138/2024
  esclude art. 17 e Capi IV-V solo per i settori 3 e 4 dell'Allegato I; nel settore
  cloud (Allegato I p. 8) la domanda dora non instrada al regime dora. Esito dalle
  regole dimensionali (essenziale), con gli avvisi sugli esoneri di piattaforma della
  Det. 127437/2026 e sull'art. 3 c. 15.
  Esito cambiato in 0.6.0: era escalate_to_advisor / ambiguous con regime_routing [dora].

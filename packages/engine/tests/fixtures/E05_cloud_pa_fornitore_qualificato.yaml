scenario_id: E05
name: cloud_pa_fornitore_qualificato
description_it: >
  Fornitore cloud di grande dimensione i cui servizi sono qualificati per la PA
  (Regolamento Cloud). ADR 0014: la domanda comune cloud_pa non instrada piu' al
  regime cloud_pa, perche' l'art. 4 Det. 155238/2026 riguarda i soggetti che hanno
  svolto la classificazione dei propri dati e servizi (le PA, FAQ CAT.8) e il
  fornitore qualificato rientra come fornitore cloud (FAQ A1.8.2). Esito dalle regole
  dimensionali del settore (essenziale), con avviso di catalogo.
  Esito cambiato in 0.6.0: era escalate_to_advisor / ambiguous con regime_routing [cloud_pa].
corpus_version: 0.13.0

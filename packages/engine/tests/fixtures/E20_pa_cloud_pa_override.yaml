scenario_id: E20
name: pa_cloud_pa_override
description_it: >
  Comune capoluogo di regione (Allegato III lett. c) che ha classificato i propri dati
  e servizi digitali ai sensi del Regolamento Cloud. Nel percorso PA l'override Cloud
  PA è raggiungibile tramite la domanda classificazione_cloud_pa (C5, corpus 0.5.0):
  instradamento al regime cloud_pa come escalation copiata dal meta del regime
  (ADR 0009), regime_routing [cloud_pa].
corpus_version: 0.5.0
sector: pubblica_amministrazione

inputs:
  psnc: "no"
  dora: "no"
  categoria_pa: c
  sottotipo_c: comune_capoluogo
  classificazione_cloud_pa: "yes"
  soggetto_critico: "no"

expected:
  # ADR 0009: instradamento a regime = escalation, copiata dal meta del regime
  assessment_mode: escalate_to_advisor
  verdict_outcome: ambiguous
  regime_routing:
    - regime: cloud_pa
      routing_effect: model_substitution
      residual_nis_obligation: null   # null = non attestato nel corpus, non "nessuno"
      exceptions_catalog_entry: cloud_pa_model_substitution
  corpus_ref: "wizard/wizard__pubblica_amministrazione.yaml#classificazione_cloud_pa -> sectors/sectors__pubblica_amministrazione.yaml#overrides[classificazione_cloud_pa==yes] -> regimes/cloud_pa.yaml + exceptions/exceptions__catalog.yaml#exceptions[cloud_pa_model_substitution]"

citations: [dd_acn_21007_24_art_3, det_acn_155238_2026_art_4]

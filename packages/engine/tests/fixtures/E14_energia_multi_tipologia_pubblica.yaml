scenario_id: E14
name: energia_multi_tipologia_pubblica
description_it: >
  Multiutility elettrica verticalmente integrata: DSO (principale) + fornitura
  (ulteriore), a capitale prevalentemente pubblico, grande dimensione. Verdetto
  categoriale essenziale; identita' multiple intra-settore, la registrazione indica
  tutte le tipologie (cross_sector_multi_tipologia_elettrica); possibile canale
  Allegato IV in-house (cross_sector_inhouse_all_iv). Da 0.6.0 (C-E5) nessun signal
  l90_cumulo: l'art. 1 c. 1 L. 90/2024 non comprende le in-house del settore energia.
corpus_version: 0.11.1

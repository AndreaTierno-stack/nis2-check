scenario_id: E28
name: pa_esclusa_art_4_c_2_soggetto_critico
description_it: >
  Organo che l'art. 4 c. 2 D.Lgs. 138/2024 non ricomprende tra le PA dell'art. 3 cc. 6-7,
  individuato come soggetto critico ai sensi del D.Lgs. 134/2024. ADR 0016: l'esclusione per
  categoria e' una mappatura di stadio 2 su categoria_pa, la regola del soggetto critico
  include indipendentemente dalla dimensione (stadio 3, art. 3 c. 5 lett. a), canale autonomo
  rispetto ai cc. 6-7). Conflitto (2)x(3): esito, avviso e citazioni dal blocco conflicts
  (corpus 0.13.0, review avversaria del 2026-11-02, F03). PSNC e classificazione Cloud PA non
  sono poste a questo soggetto (ADR 0010, amendment).
corpus_version: 0.13.3
sector: pubblica_amministrazione

inputs:
  categoria_pa: esclusa_art_4_c_2
  dora: "no"
  soggetto_critico: "yes"

expected:
  assessment_mode: escalate_to_advisor
  verdict_outcome: ambiguous
  signals: [cer_signal]
  notices: [esclusione_tipologica_vs_inclusione_size_blind]
  regime_routing: []
  corpus_ref: "conflicts/conflicts__stages.yaml#conflicts[esclusione_tipologica_vs_inclusione_size_blind] + wizard/wizard__pubblica_amministrazione.yaml#categoria_pa.outcome_mapping[answer==esclusa_art_4_c_2] + sectors/sectors__pubblica_amministrazione.yaml#qualification_rules[categoria_pa==esclusa_art_4_c_2 AND soggetto_critico==yes] + exceptions/exceptions__catalog.yaml#exceptions[esclusione_tipologica_vs_inclusione_size_blind]"

# Citazioni come le produce l'engine: conflitto, esclusione, regola del soggetto critico, segnale.
citations: [dlgs_138_2024_art_3_c_5_lett_a, dlgs_138_2024_art_4_c_2, dlgs_138_2024_art_6_c_1_lett_b, faq_amb_no_1, dlgs_134_2024]

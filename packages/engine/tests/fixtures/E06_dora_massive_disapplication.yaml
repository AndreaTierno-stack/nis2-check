scenario_id: E06
name: dora_massive_disapplication
description_it: >
  Entita' finanziaria DORA (Reg. UE 2022/2554). La disambiguazione dora==yes
  instrada al regime dora (routing_only_v0_1): override massive_disapplication —
  regime NIS disapplicato salvo l'art. 7 c. 1 (registrazione su piattaforma ACN).
  Gli esoneri DORA sono attestati con granularita' di comma sul testo ufficiale
  (art. 7 c. 6, art. 16 c. 13, art. 20 c. 6 Det. 127437/2026): DIV-P1 chiusa.
  Esito atteso: escalate_to_advisor / ambiguous copiati dal meta del regime
  (ADR 0009), con regime_routing per Explainability e PDF.
corpus_version: 0.5.0
sector: cloud_computing

inputs:
  psnc: "no"
  dora: "yes"
  cloud_pa: "no"
  pertinenza_pubblica_cloud: "no"
  fornisce_servizi_gestiti_b2b: "no"
  dimension: grande

expected:
  # ADR 0009: instradamento a regime = escalation, copiata dal meta del regime
  assessment_mode: escalate_to_advisor
  verdict_outcome: ambiguous
  regime_routing:   # lista, ordine = ordine degli override nel file di settore (ADR 0009, amendment)
    - regime: dora
      routing_effect: massive_disapplication
      residual_nis_obligation: "art. 7 c. 1 D.Lgs. 138/2024 (registrazione su piattaforma ACN)"
      exceptions_catalog_entry: dora_massive_disapplication
  open_points: []
  corpus_ref: "sectors/sectors__cloud_computing.yaml#overrides[dora==yes] -> regimes/dora.yaml"

citations:

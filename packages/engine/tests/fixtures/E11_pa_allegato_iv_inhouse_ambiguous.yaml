  verdict_outcome: ambiguous
  signals: [allegato_iv_individuazione, cross_sector_inhouse_all_iv]
  notices: [pa_categorie_aggiunte_dpcm_art_3_c_7, allegato_iv_individuazione_art_3_c_8]
  regime_routing: []

# ============================================================================
# Domande binarie di disambiguazione di regime — COMUNI a tutti i settori
# Referenziate dai file wizard/<settore>.yaml
# Ordine di esecuzione: queste 3 domande precedono l'identificazione standard
# ============================================================================

meta:
  block_id: disambiguation
  execution_order: pre_standard_identification
  description_it: |
    Tre domande binarie iniziali che instradano il flusso verso percorsi
    alternativi quando il soggetto rientra in un regime correlato. Ogni
    domanda altera il flusso in modo diverso: PSNC sovrascrive la categoria,
    DORA disapplica, Cloud PA sostituisce il modello.

questions:
  - id: psnc
    kind: binary
    label_it: "Il soggetto è stato formalmente inserito nel Perimetro di Sicurezza Nazionale Cibernetica (PSNC) ai sensi del DL 105/2019, con notifica ricevuta da ACN o dal CISR?"
    help_text_it: |
      Il PSNC riguarda un numero ristretto di soggetti (stimati 150-250) che
      gestiscono funzioni essenziali dello Stato. L'inclusione avviene con
      atto formale: se non hai ricevuto una notifica esplicita, rispondi "no".
    on_yes:
      effect: category_override
      reference: regimes/psnc.yaml
    citations: [dl_105_2019_art_1_c_2_bis, det_acn_155238_2026_art_5]

  - id: dora
    kind: binary
    label_it: "Il soggetto è un'entità finanziaria regolata dal Regolamento (UE) 2022/2554 (DORA) — ad esempio banca, impresa di investimento, infrastruttura dei mercati finanziari?"
    help_text_it: |
      DORA è la normativa europea sulla resilienza operativa digitale del
      settore finanziario. Se il soggetto è una banca o un'infrastruttura
      dei mercati finanziari di dimensione media o grande, rispondi "sì".
    on_yes:
      effect: massive_disapplication
      reference: regimes/dora.yaml
    citations: [reg_ue_2022_2554, dlgs_138_2024_art_3_c_14, faq_amb_no_2]

  - id: cloud_pa
    kind: binary
    label_it: "Il soggetto eroga servizi cloud destinati a una Pubblica Amministrazione, classificati ai sensi della disciplina Cloud PA (ordinari/critici/strategici)?"
    help_text_it: |
      Riguarda i fornitori cloud i cui servizi sono stati qualificati nel
      quadro della strategia Cloud per la PA. Se i tuoi servizi cloud sono
      destinati a clienti privati, rispondi "no".
    on_yes:
      effect: model_substitution
      reference: regimes/cloud_pa.yaml
    citations: [dd_acn_21007_24_art_3, det_acn_155238_2026_art_4]

# ============================================================================
# Caso di intersezione multipla — open question normativa
# ============================================================================

multi_regime_intersection:
  # Se PSNC e Cloud PA sono entrambi positivi, l'ordine di precedenza tra
  # l'automatismo "alto" PSNC (art. 5) e la sostituzione di modello Cloud PA
  # (art. 4) non e' esplicitato nelle fonti. Il decision engine produce
  # escalate_to_advisor invece di tentare di risolvere.
  # NOTA: DORA non entra nel conflitto perche' disapplica massivamente e
  # prevale come lex specialis, senza conflitto di precedenza.
  - trigger: psnc == yes AND cloud_pa == yes
    outcome: escalate_to_advisor
    verdict_outcome: ambiguous   # vincolo fisso: escalate_to_advisor -> sempre ambiguous (l'engine copia senza inferenza)
    reasoning_trace: "Il soggetto appare contemporaneamente in perimetro PSNC e nella disciplina Cloud PA. L'ordine di precedenza tra l'automatismo 'alto' PSNC (art. 5) e la sostituzione di modello Cloud PA (art. 4) non è esplicitato nelle fonti normative disponibili. Consulenza qualificata necessaria, con eventuale interlocuzione diretta ACN."
    citations: [det_acn_155238_2026_art_4, det_acn_155238_2026_art_5]
